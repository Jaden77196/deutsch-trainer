<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<title>Deutsch · 德语训练</title>
<style>
/* ============================================================
   设计系统
   冷调纸感（不用米色/奶油色）+ 深蓝墨色。
   唯一的高亮留给"掌握度"——五个圆点，呼应德语 Umlaut 的两点。
   名词按 der/die/das 上色，这是德语教材的通行做法，也是功能性的。
   ============================================================ */
:root{
  --paper:#EDEFF2; --paper-2:#E4E8ED; --paper-3:#DCE1E7;
  --ink:#1A222C; --ink-soft:#5C6875; --ink-faint:#8B96A3;
  --rule:#D2D8DF; --rule-soft:#E0E5EA;
  --accent:#2F4B8F; --accent-soft:#E2E8F5;
  --der:#2F4B8F; --die:#A63D52; --das:#3E7A5E;
  --ok:#3E7A5E; --ok-soft:#E1EEE7;
  --no:#A64B3C; --no-soft:#F6E4E0;
  --font-de:Georgia,'Times New Roman','Noto Serif','Source Han Serif SC',serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:10px;
  --pad:20px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12161C; --paper-2:#191E26; --paper-3:#212833;
    --ink:#E8ECF1; --ink-soft:#9AA5B2; --ink-faint:#6E7885;
    --rule:#2A313B; --rule-soft:#232A34;
    --accent:#7C9BD8; --accent-soft:#1B2434;
    --der:#7C9BD8; --die:#D98A9B; --das:#7FBF9C;
    --ok:#7FBF9C; --ok-soft:#16241D;
    --no:#D9948A; --no-soft:#2A1C19;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:16px;line-height:1.6;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px var(--pad) 12px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--paper);z-index:10;
}
.topbar .back{
  font-size:15px;color:var(--ink-soft);background:none;border:0;
  padding:10px 12px 10px 0;margin:0;cursor:pointer;font-family:inherit;
  min-width:44px;text-align:left;
}
.topbar .back:active{color:var(--ink)}
.topbar .title{flex:1;font-size:15px;font-weight:600;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .title small{display:block;font-weight:400;font-size:12px;color:var(--ink-faint);
  font-family:var(--font-de);font-style:italic;letter-spacing:.02em}

/* ---------- 掌握度：五个圆点 ---------- */
.dots{display:flex;gap:6px;align-items:center}
.dots i{
  width:9px;height:9px;border-radius:50%;background:transparent;
  border:1.5px solid var(--rule);display:block;transition:background .25s,border-color .25s,transform .25s;
}
.dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.dots i.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.7)}100%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.dots i,.dots i.pop{animation:none;transition:none}}

/* ---------- 舞台 ---------- */
.stage{flex:1;display:flex;flex-direction:column;padding:0 var(--pad)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center}

/* ---------- 德语词 ---------- */
.de{
  font-family:var(--font-de);font-weight:400;
  font-size:clamp(30px,9vw,44px);line-height:1.2;letter-spacing:-.01em;
  word-break:break-word;
}
.de.sm{font-size:clamp(22px,6.5vw,30px)}
.art{font-style:italic;font-weight:400}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
.hint{font-size:14px;color:var(--ink-faint);margin-top:8px;letter-spacing:.02em}
.zh{font-size:19px;color:var(--ink);margin-top:6px}
.zh.dim{color:var(--ink-soft)}

/* ---------- 例句 ---------- */
.ex{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule-soft)}
.ex .de{font-size:clamp(19px,5.4vw,23px);line-height:1.5}
.ex .zh{font-size:15px;color:var(--ink-soft);margin-top:8px}
.blank{
  display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);
  text-align:center;color:var(--accent);font-weight:600;
}
.fill{color:var(--ok);font-weight:600;border-bottom:2px solid var(--ok)}
.miss{color:var(--no);text-decoration:line-through;text-decoration-thickness:2px}

/* ---------- 按钮 ---------- */
.actions{display:flex;flex-direction:column;gap:10px;padding:22px 0 30px}
.btn{
  font-family:inherit;font-size:17px;font-weight:600;
  padding:16px 20px;border-radius:var(--r);border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
  min-height:56px;transition:background .15s,transform .1s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0F141A}}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1}

/* ---------- 选项 ---------- */
.opts{display:flex;flex-direction:column;gap:10px;padding:20px var(--pad) 26px}
.opt{
  font-family:inherit;font-size:17px;text-align:left;
  padding:15px 18px;border-radius:var(--r);border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
  min-height:56px;transition:background .15s,border-color .15s;
}
.opt .n{color:var(--ink-faint);margin-right:10px;font-variant-numeric:tabular-nums}
.opt:active{transform:scale(.99)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.opt.muted{opacity:.5}
.opt:disabled{cursor:default}

/* ---------- 输入 ---------- */
.input{
  font-family:var(--font-de);font-size:19px;
  width:100%;padding:16px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  min-height:56px;
}
.input:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.input::placeholder{color:var(--ink-faint);font-family:var(--font-ui);font-size:16px}
.specials{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.specials button{
  font-family:var(--font-de);font-size:19px;min-width:48px;min-height:44px;
  padding:6px 12px;border-radius:8px;border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
}
.specials button:active{background:var(--paper-3)}

/* ---------- 反馈 ---------- */
.judge{margin-top:16px;font-size:15px;line-height:1.6;padding:12px 14px;border-radius:var(--r)}
.judge.ok{background:var(--ok-soft);color:var(--ok)}
.judge.no{background:var(--no-soft);color:var(--no)}
.judge b{font-family:var(--font-de);font-size:17px}

/* ---------- 发音按钮 ---------- */
.speak{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-size:15px;color:var(--ink-soft);
  background:none;border:1px solid var(--rule);border-radius:999px;
  padding:10px 18px;margin-top:18px;cursor:pointer;min-height:44px;
}
.speak:active{background:var(--paper-2)}
.speak svg{width:17px;height:17px;flex:none}

/* ---------- 首页 ---------- */
.head{padding:26px var(--pad) 20px}
.head h1{font-family:var(--font-de);font-size:30px;margin:0;font-weight:400;letter-spacing:-.01em}
.head p{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
.lvhead{display:flex;align-items:center;gap:12px;padding:26px var(--pad) 9px}
.lvhead span:first-child{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:.08em}
.lvline{flex:1;height:1px;background:var(--rule-soft)}
.list{border-top:1px solid var(--rule)}
.item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px var(--pad);border:0;border-bottom:1px solid var(--rule);
  background:none;color:var(--ink);font-family:inherit;font-size:16px;cursor:pointer;
}
.item:active{background:var(--paper-2)}
.item .idx{
  font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);
  min-width:22px;font-variant-numeric:tabular-nums;
}
.item .body{flex:1;min-width:0}
.item .nm{font-size:16px;font-weight:500}
.item .nm small{display:block;font-family:var(--font-de);font-style:italic;
  font-weight:400;font-size:13px;color:var(--ink-faint);letter-spacing:.02em}
.item.locked{opacity:.42;cursor:default}
.item.locked:active{background:none}
.item.done .idx{color:var(--accent)}
.item .cnt{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.badge{
  font-size:11px;padding:2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;
}
.foot{padding:22px var(--pad) 34px;font-size:12px;color:var(--ink-faint);line-height:1.8}
.foot button{
  font-family:inherit;font-size:12px;color:var(--ink-faint);
  background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}

/* ---------- 阅读 ---------- */
.passage{font-family:var(--font-de);font-size:18px;line-height:1.75;letter-spacing:.005em}
.passage p{margin:0 0 1.1em}
.q{margin-top:26px;padding-top:20px;border-top:1px solid var(--rule-soft)}
.q .qt{font-size:16px;font-weight:600;margin-bottom:12px}
.q .qt small{display:block;font-family:var(--font-de);font-weight:400;
  font-size:15px;color:var(--ink-soft);margin-top:4px}
.trans{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule-soft);
  font-size:15px;color:var(--ink-soft);line-height:1.9}

/* ---------- 语法讲义卡片 ---------- */
.core{padding:24px var(--pad) 0;font-size:18px;line-height:1.8}
.core strong,.core b{color:var(--accent);font-weight:600}
.rtable{margin:22px var(--pad) 0;border-top:1px solid var(--rule)}
.rtable .r{padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.rtable .c1{font-size:13px;color:var(--ink-faint);line-height:1.5;margin-bottom:5px}
.rtable .c2{font-size:15px;line-height:1.6}
.rtable .c2 b{display:block;font-weight:600;color:var(--ink)}
.rtable .c2 b.g-der{color:var(--der)}
.rtable .c2 b.g-die{color:var(--die)}
.rtable .c2 b.g-das{color:var(--das)}
.rtable .c2 span{display:block;font-family:var(--font-de);font-size:14px;
  color:var(--ink-soft);margin-top:4px;line-height:1.55}
.regs{margin:22px var(--pad) 0}
.regs .e{padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.regs .e .de{font-family:var(--font-de);font-size:17px;line-height:1.5}
.regs .e .zh{font-size:14px;color:var(--ink-soft);margin-top:4px}
.rnote{margin:22px var(--pad) 0;padding:15px 17px;background:var(--paper-2);
  border-radius:var(--r);font-size:14px;line-height:1.85;color:var(--ink-soft)}
.rnote strong{color:var(--ink)}
.navrow{display:flex;gap:10px;padding:24px var(--pad) 8px}
.navrow .btn{flex:1;font-size:15px;padding:15px 10px;min-height:52px}

/* ---------- 进度条 ---------- */
.bar{height:2px;background:var(--rule-soft);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.mode-list{padding:8px 0 0}
.mode{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:17px var(--pad);border:0;border-bottom:1px solid var(--rule);
  background:none;color:var(--ink);font-family:inherit;cursor:pointer;
}
.mode:active{background:var(--paper-2)}
.mode .k{font-family:var(--font-de);font-size:20px;color:var(--ink-faint);min-width:26px}
.mode .body{flex:1}
.mode .nm{font-size:16px;font-weight:500}
.mode .sub{font-size:13px;color:var(--ink-faint);margin-top:2px}
.mode .arrow{color:var(--ink-faint);font-size:18px}
.note{padding:16px var(--pad) 0;font-size:13px;color:var(--ink-soft);line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<script src="content-a1.js"></script>
<script src="content-a2.js"></script>
<script src="content-b1.js"></script>
<script src="content-phrases.js"></script>
<script src="content-b2.js"></script>
<script src="content-readings.js"></script>
<script src="content-topics-a.js"></script>
<script src="content-topics-b.js"></script>
<script>
/* ============================================================
   课程内容
   单词格式：[德语, 中文, 读音提示, 例句, 例句译文, 词性]
     - 名词在德语里带上冠词，如 'die Familie'，程序会自动解析词性颜色
     - 例句里用 { } 标出可以挖空的部分（用变位后的形式，如 {bin}）
     - 词性：n 名词 / v 动词 / a 形容词 / x 其他
   要加新词，直接在对应的 w 数组里加一行即可。
   ============================================================ */
const GROUPS = [].concat(
  window.CONTENT_A1||[], window.CONTENT_A2||[], window.CONTENT_B1||[],
  window.CONTENT_PHRASES||[], window.CONTENT_B2||[]
);
const TOPICS = [].concat(window.CONTENT_TOPICS_A||[], window.CONTENT_TOPICS_B||[]);

/* 阅读理解：难度递进，after 表示学完第几组后解锁 */
const READINGS = window.CONTENT_READINGS || [];

/* ============================================================
   应用逻辑
   ============================================================ */
const KEY='deutsch.v1';
const PASSES=5;                 // 满分几遍解锁下一组
const DEF={g:{},set:{article:true,strict:true,rate:0.85,allOpen:false}};
let S=JSON.parse(JSON.stringify(DEF));

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const p=JSON.parse(r);S.g=p.g||{};S.set=Object.assign({},DEF.set,p.set||{});}
  }catch(e){}
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function gs(i){ // group state
  const k='g'+i;
  if(!S.g[k])S.g[k]={dots:0,seen:false,w:{}};
  return S.g[k];
}
function unlocked(i){ return S.set.allOpen || i===0 || gs(i-1).dots>=PASSES; }
function mastered(i){ return gs(i).dots>=PASSES; }

/* ---------- 工具 ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 解析单词 ---------- */
function pw(w){
  const [de,zh,hint,ex,exZh,type]=w;
  let art=null,bare=de;
  const m=de.match(/^(der|die|das)\s+(.+)$/i);
  if(m){art=m[1].toLowerCase();bare=m[2];}
  const bm=ex.match(/\{([^}]*)\}/);
  const blank=bm?bm[1]:null;
  const parts=ex.split(/\{[^}]*\}/);
  return {de,bare,art,zh,hint,ex,exZh,type,blank,parts};
}
/* 句子用 HTML 还原：fill=填入的词（高亮），null=显示下划线空位 */
function sentHTML(p,fill){
  if(!p.blank)return esc(p.ex);
  const mid = fill===null ? '<span class="blank">&nbsp;&nbsp;&nbsp;</span>'
    : (fill===false ? '<span class="blank">&nbsp;&nbsp;&nbsp;</span>'
    : '<span class="fill">'+esc(fill)+'</span>');
  return esc(p.parts[0])+mid+esc(p.parts[1]||'');
}
/* 词性色 */
function artClass(a){return a==='der'?'der':a==='die'?'die':a==='das'?'das':'';}

/* ============================================================
   语音合成（德语 TTS）
   ============================================================ */
let deVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices()||[];
  deVoice = vs.find(v=>/^de([-_]|$)/i.test(v.lang)&&/google|premium|enhanced|siri/i.test(v.name))
         || vs.find(v=>/^de([-_]|$)/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(text,rate){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=rate||S.set.rate;
    if(!deVoice)pickVoice();
    if(deVoice)u.voice=deVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
const SPEAK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ============================================================
   路由
   ============================================================ */
let route={v:'home'};
let ses=null;   // 当前练习会话
let rd=null;    // 阅读理解状态（独立于 ses，否则会劫持 render() 的路由分发）
const app=document.getElementById('app');

function go(v,extra){
  route=Object.assign({v},extra||{});
  render();
  window.scrollTo(0,0);
}

function render(){
  if(ses)      renderSession();
  else if(route.v==='home')     renderHome();
  else if(route.v==='group')    renderGroup(route.i);
  else if(route.v==='readings') renderReadings();
  else if(route.v==='reading')  renderReading(route.id);
  else if(route.v==='topics')   renderTopicList();
  else if(route.v==='topic')    renderTopic(route.i);
  else if(route.v==='backup')   renderBackup();
}

function topbar(title,sub,back){
  return '<div class="topbar">'
   +(back?'<button class="back" id="bk">← 返回</button>':'')
   +'<div class="title">'+esc(title)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'
   +'</div>';
}
function bindBack(fn){
  const b=document.getElementById('bk');
  if(b)b.onclick=fn;
}

/* ============================================================
   首页
   ============================================================ */
function renderHome(){
  const levels=[...new Set(GROUPS.map(g=>g.lv||'A1'))];
  let done=0;
  GROUPS.forEach((g,i)=>{if(mastered(i))done++;});
  let h='<div class="head"><h1>Deutsch</h1>'
   +'<p>已掌握 '+done+' / '+GROUPS.length+' 组　·　每组五遍满分解锁下一组</p></div>';
  if(!STORAGE_OK){
    h+='<div class="note" style="color:var(--no);padding-top:0;padding-bottom:4px">'
     +'⚠️ 这个浏览器不让本地文件保存数据，进度关掉页面就会丢。'
     +'建议改用在线版，或者每次练完到「设置 → 进度备份」复制进度码存下来。</div>';
  }
  levels.forEach(lv=>{
    h+='<div class="lvhead"><span>'+esc(lv)+'</span><span class="lvline"></span></div><div class="list">';
    GROUPS.forEach((g,i)=>{
      if((g.lv||'A1')!==lv)return;
      const st=gs(i),lock=!unlocked(i),ok=mastered(i);
      h+='<button class="item'+(lock?' locked':'')+(ok?' done':'')+'" data-g="'+i+'"'+(lock?' disabled':'')+'>'
       +'<span class="idx">'+(ok?'✓':String(i+1).padStart(2,'0'))+'</span>'
       +'<span class="body"><span class="nm">'+esc(g.t)
       +'<small>'+esc(g.s)+'</small></span></span>'
       +'<span class="cnt">'+st.dots+'/'+PASSES+'</span>'
       +dots(st.dots)+'</button>';
    });
    h+='</div>';
  });

/* ============================================================
   会话引擎
   ============================================================ */
function startSession(m,gi){
  const g=GROUPS[gi];
  const words=shuffle(g.w.map(pw));
  ses={mode:m,gi:gi,words:words,i:0,wrong:0,answered:false,roundFailed:false};
  gs(gi).seen=true; save();
  if(m==='dict'){ ses.i=0; }
  render();
}

function renderSession(){
  const m=ses.mode;
  if(m==='learn')  return renderLearn();
  if(m==='blank')  return renderBlank();
  if(m==='review') return renderReview();
  if(m==='dict')   return renderDict();
  if(m==='tq')     return renderTopicQuiz();
}

/* --- 进度条 + 顶栏 --- */
function sesTop(label){
  const g=GROUPS[ses.gi];
  const n=ses.words.length;
  return topbar(label,g.t,true)
   +'<div class="bar"><i style="width:'+(ses.i/n*100)+'%"></i></div>';
}
function exitSes(){ ses=null; go('group',{i:route.i!==undefined?route.i:0}); }

/* ============================================================

     +'<div class="ex"><div class="ex-de de">'+sentHTML(w,w.blank)+'</div>'
     +'<div class="zh">'+esc(w.exZh)+'</div></div>'
     +'</div></div>'
     +'<div class="actions"><button class="btn primary" id="nx">'

    app.innerHTML=sesTop('学习生词 · '+(ses.i+1)+'/'+ses.words.length)

     +'<div class="de'+(w.de.length>16?' sm':'')+'">'
       +(w.art?'<span class="art '+artClass(w.art)+'">'+esc(w.art)+'</span> ':'')+esc(w.bare)+'</div>'

/* ============================================================
   模式二：选词填空
   ============================================================ */
function makeOptions(w,all,field){
  const pool=shuffle(all.filter(x=>x[field]!==w[field])).slice(0,3).map(x=>x[field]);
  return shuffle([w[field]].concat(pool));
}
function renderBlank(){
  const w=ses.words[ses.i];
  if(!w||!w.blank){ return endSession(); }
  const all=ses.words.filter(x=>x.blank);
  const opts=ses.opts||(ses.opts=makeOptions(w,all,'blank'));
  let h=sesTop('选词填空 · '+(ses.i+1)+'/'+ses.words.length)
   +'<div class="stage"><div style="padding-top:34px">'
   +'<div class="de" style="font-size:clamp(21px,6vw,26px);line-height:1.55">'
   +sentHTML(w, ses.picked===undefined?null:(ses.picked===w.blank?w.blank:false))
   +'</div><div class="zh dim" style="margin-top:14px;font-size:15px">'+esc(w.exZh)+'</div>'
   +'</div></div><div class="opts">';
  opts.forEach((o,k)=>{
    let cls='opt';
    if(ses.picked!==undefined){
      if(o===w.blank)cls+=' correct';
      else if(o===ses.picked)cls+=' wrong';
      else cls+=' muted';
    }
    h+='<button class="'+cls+'" data-o="'+esc(o)+'"'+(ses.picked!==undefined?' disabled':'')+'>'
     +'<span class="n">'+'ABCD'[k]+'</span>'+esc(o)+'</button>';
  });
  h+='</div>';
  if(ses.picked!==undefined){
    h+='<div class="actions" style="padding-top:0"><button class="btn primary" id="nx">'
     +(ses.i+1<ses.words.length?'下一题':'完成')+'</button></div>';
  }else{h+='<div style="height:30px"></div>';}
  app.innerHTML=h;
  bindBack(exitSes);
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(ses.picked!==undefined)return;
      ses.picked=b.dataset.o;
      const ok=ses.picked===w.blank;
      if(!ok)ses.wrong++;
      render();
    };
  });
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.picked=undefined;ses.opts=null;ses.i++;render();};
}

/* ============================================================
   模式三：复习（中德互译）
   ============================================================ */
function renderReview(){
  const w=ses.words[ses.i];
  if(!w)return endSession();
  if(ses.dir===undefined)ses.dir=Math.random()<0.5?'de2zh':'zh2de';
  const all=ses.words;
  const field=ses.dir==='de2zh'?'zh':'bare';
  const opts=ses.opts||(ses.opts=makeOptions(w,all,field));
  const prompt=ses.dir==='de2zh'
    ? '<div class="de'+(w.de.length>16?' sm':'')+'">'
      +(w.art?'<span class="art '+artClass(w.art)+'">'+esc(w.art)+'</span> ':'')+esc(w.bare)+'</div>'
    : '<div class="zh" style="font-size:26px">'+esc(w.zh)+'</div>';
  let h=sesTop('复习 · '+(ses.i+1)+'/'+ses.words.length)
   +'<div class="stage"><div class="center">'+prompt
   +'<div class="hint" style="margin-top:12px">'
   +(ses.dir==='de2zh'?'选出中文意思':'选出对应的德语')+'</div></div></div><div class="opts">';
  opts.forEach((o,k)=>{
    let cls='opt';
    if(ses.picked!==undefined){
      if(o===w[field])cls+=' correct';
      else if(o===ses.picked)cls+=' wrong';
      else cls+=' muted';
    }
    const isDe=(ses.dir==='zh2de');
    h+='<button class="'+cls+'" data-o="'+esc(o)+'"'+(ses.picked!==undefined?' disabled':'')+'>'
     +'<span class="n">'+'ABCD'[k]+'</span>'
     +(isDe?'<span style="font-family:var(--font-de);font-size:18px">'+esc(o)+'</span>':esc(o))
     +'</button>';
  });
  h+='</div>';
  if(ses.picked!==undefined)
    h+='<div class="actions" style="padding-top:0"><button class="btn primary" id="nx">'
     +(ses.i+1<ses.words.length?'下一题':'完成')+'</button></div>';
  else h+='<div style="height:30px"></div>';
  app.innerHTML=h;
  bindBack(exitSes);
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(ses.picked!==undefined)return;
      ses.picked=b.dataset.o;
      if(ses.picked!==w[field])ses.wrong++;
      render();
    };
  });
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.picked=undefined;ses.opts=null;ses.dir=undefined;ses.i++;render();};
}

/* ============================================================
   模式四：默写生词（听力/中文提示 → 写出德语）
   ============================================================ */
function norm(s){
  return String(s).toLowerCase().trim().replace(/\s+/g,' ')
   .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
   .replace(/[.,!?;:]/g,'');
}
function renderDict(){
  const w=ses.words[ses.i];
  if(!w)return endDictRound();
  const expect = (w.art&&S.set.article) ? (w.art+' '+w.bare) : w.bare;
  let h=sesTop('默写 · '+(ses.i+1)+'/'+ses.words.length)
   +'<div class="stage"><div style="padding-top:26px">'
   +'<div class="zh" style="font-size:24px">'+esc(w.zh)+'</div>'
   +'<div class="hint" style="margin-top:10px">写出对应的德语'
   +(w.art&&S.set.article?'（含冠词）':'')+'</div>'
   +'<button class="speak" id="sp" style="margin-top:16px">'+SPEAK_ICON+'再听一次</button>'
   +'<div style="margin-top:22px"><input class="input" id="in" autocomplete="off" '
   +'autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入德语"></div>'
   +'<div class="specials"><button data-c="ä">ä</button><button data-c="ö">ö</button>'
   +'<button data-c="ü">ü</button><button data-c="ß">ß</button></div>';
  if(ses.judged){
    const ok=ses.wasOk;
    h+='<div class="judge '+(ok?'ok':'no')+'">'
     +(ok?'正确　<b>'+esc(expect)+'</b>'
         :'正确写法是　<b>'+esc(expect)+'</b>'
          +(ses.reason==='art'?'　<span style="font-size:13px">别漏了冠词</span>':''))
     +'</div>';
  }
  h+='</div></div><div class="actions">'
   +(ses.judged
     ?'<button class="btn primary" id="nx">'+(ses.i+1<ses.words.length?'下一个':'看本轮结果')+'</button>'
     :'<button class="btn primary" id="ck">检查</button>')
   +'</div>';
  app.innerHTML=h;
  bindBack(exitSes);
  const inp=document.getElementById('in');
  document.getElementById('sp').onclick=()=>speak(w.de);
  app.querySelectorAll('.specials button').forEach(b=>{
    b.onclick=()=>{
      const p=inp.selectionStart||inp.value.length;
      inp.value=inp.value.slice(0,p)+b.dataset.c+inp.value.slice(p);
      inp.focus(); inp.setSelectionRange(p+1,p+1);
    };
  });
  const check=()=>{
    if(ses.judged)return;
    const v=inp.value.trim();
    if(!v)return;
    ses.judged=true;
    const target=norm(expect), got=norm(v);
    ses.wasOk = got===target;
    if(!ses.wasOk){
      ses.reason = (w.art&&S.set.article&&got===norm(w.bare))?'art':'';
      ses.wrong++;
    }
    render();
  };
  const ck=document.getElementById('ck');
  if(ck)ck.onclick=check;
  if(!ses.judged&&inp){
    inp.onkeydown=e=>{if(e.key==='Enter')check();};
    const spEl=document.getElementById('sp');
    setTimeout(()=>{speak(w.de);},60);
  }
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.i++;ses.judged=false;ses.wasOk=false;ses.reason='';render();};
}
function endDictRound(){
  const perfect = ses.wrong===0;
  const st=gs(ses.gi);
  if(perfect){
    st.dots=Math.min(PASSES,st.dots+1); save();
  }else if(S.set.strict){
    st.dots=0; save();
  }
  const g=GROUPS[ses.gi], ok=mastered(ses.gi);
  const nextIdx=ses.gi+1;
  let h=sesTop('本轮结果')
   +'<div class="stage"><div class="center" style="text-align:center">'
   +'<div class="de" style="font-size:34px">'+(perfect?'Sehr gut!':'Fast!')+'</div>'
   +'<div class="zh" style="margin-top:12px">'
   +(perfect?'一轮全部正确':'本轮错了 '+ses.wrong+' 个')+'</div>'
   +'<div style="margin-top:26px;display:flex;justify-content:center">'+dots(st.dots)+'</div>'
   +'<div class="hint" style="margin-top:12px">掌握度 '+st.dots+' / '+PASSES
   +(perfect?'':'　（只有全对的一轮才算一遍）')+'</div>'
   +(ok?'<div class="zh" style="margin-top:22px;color:var(--accent)">这一组掌握了。</div>':'')
   +'</div></div>'
   +'<div class="actions">'
   +'<button class="btn primary" id="again">再默写一轮</button>'
   +(ok&&nextIdx<GROUPS.length
      ?'<button class="btn" id="next">进入下一组：'+esc(GROUPS[nextIdx].t)+'</button>':'')
   +'<button class="btn ghost" id="bk2">回到这一组</button>'
   +'</div>';
  app.innerHTML=h;
  bindBack(()=>{ses=null;go('home');});
  document.getElementById('again').onclick=()=>{
    const gi=ses.gi; ses=null; startSession('dict',gi);
  };
  const nb=document.getElementById('next');
  if(nb)nb.onclick=()=>{const n=nextIdx;ses=null;go('group',{i:n});};
  document.getElementById('bk2').onclick=()=>{const gi=ses.gi;ses=null;go('group',{i:gi});};
}

/* ============================================================

function endSession(){

/* ---------- 这条知识点专属的练习 ---------- */
function startTopicQuiz(ti){
  const t=TOPICS[ti];
  ses={mode:'tq',ti:ti,t:t,items:shuffle(t.items),i:0,wrong:0,picked:undefined};
  render();
}
function renderTopicQuiz(){
  const t=ses.t, it=ses.items[ses.i];
  if(!it)return endTopicQuiz();
  const n=ses.items.length;
  let h=topbar(t.t,t.s||'',true)
   +'<div class="bar"><i style="width:'+(ses.i/n*100)+'%"></i></div>'
   +'<div style="padding:22px var(--pad) 0">'
   +'<div class="hint" style="margin:0 0 8px">第 '+(ses.i+1)+' / '+n+' 题</div>'
   +'<div class="de" style="font-size:clamp(19px,5.4vw,23px);line-height:1.65">'+esc(it.q)+'</div>'
   +'</div><div class="opts">';
  it.opts.forEach((o,k)=>{
    let cls='opt';
    if(ses.picked!==undefined){
      if(o===it.a)cls+=' correct';
      else if(o===ses.picked)cls+=' wrong';
      else cls+=' muted';
    }
    h+='<button class="'+cls+'" data-o="'+esc(o)+'"'+(ses.picked!==undefined?' disabled':'')+'>'
     +'<span class="n">'+'ABCD'[k]+'</span>'+esc(o)+'</button>';
  });
  h+='</div>';
  if(ses.picked!==undefined){
    const right=(ses.picked===it.a);
    if(!right){
      h+='<div class="rnote" style="margin:0 var(--pad)"><strong>回顾这条的规则</strong><br>'+t.core+'</div>';
    }
    h+='<div class="judge '+(right?'ok':'no')+'" style="margin:16px var(--pad) 0">'+esc(it.why)+'</div>'
     +'<div class="actions" style="padding:18px var(--pad) 30px">'
     +'<button class="btn primary" id="nx">'+(ses.i+1>=n?'看结果':'下一题')+'</button></div>';
  }else h+='<div style="height:30px"></div>';
  app.innerHTML=h;
  const ti=ses.ti;
  bindBack(()=>{ses=null;go('topic',{i:ti});});
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(ses.picked!==undefined)return;
      ses.picked=b.dataset.o;
      if(ses.picked!==it.a)ses.wrong++;
      render();
    };
  });
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.picked=undefined;ses.i++;render();};
}
function endTopicQuiz(){
  const ti=ses.ti, t=ses.t, wrong=ses.wrong, n=ses.items.length;
  if(wrong===0){ gs(2000+ti).done=true; save(); }
  app.innerHTML=topbar('结果',t.t,true)
   +'<div class="stage"><div class="center" style="text-align:center">'
   +'<div class="de" style="font-size:34px">'+(n-wrong)+' / '+n+'</div>'
   +'<div class="zh" style="margin-top:12px">'
   +(wrong===0?'全对，这条过了':'错了 '+wrong+' 题，回去把讲义再看一遍')+'</div>'
   +'</div></div><div class="actions">'
   +'<button class="btn primary" id="re">重做这 '+n+' 题</button>'
   +'<button class="btn" id="rd">再看这条讲义</button>'
   +'<button class="btn ghost" id="bk2">回到目录</button></div>';
  bindBack(()=>{ses=null;go('topics');});
  document.getElementById('re').onclick=()=>{ses=null;startTopicQuiz(ti);};
  document.getElementById('rd').onclick=()=>{ses=null;go('topic',{i:ti});};
  document.getElementById('bk2').onclick=()=>{ses=null;go('topics');};
}
/* ============================================================
   阅读理解
   ============================================================ */
function renderReading(id){
  const r=READINGS.find(x=>x.id===id);
  if(!r)return go('readings');
  if(!rd||rd.rid!==id) rd={rid:id,ans:{},showTr:false};
  let h=topbar(r.t,r.zh,true)
   +'<div class="stage"><div style="padding-top:26px" class="passage">'
   +r.de.map(p=>'<p>'+esc(p)+'</p>').join('')
   +'</div>';
  if(rd.showTr){
    h+='<div class="trans">'+esc(r.tr)+'</div>';
  }else{
    h+='<div style="padding:4px 0 0"><button class="speak" id="tr">显示中文翻译</button></div>';
  }
  r.qs.forEach((q,qi)=>{
    h+='<div class="q"><div class="qt">'+(qi+1)+'. '+esc(q.q)
     +'<small>'+esc(q.de)+'</small></div><div class="opts" style="padding:0 0 4px">';
    const picked=rd.ans[qi];
    q.o.forEach((o,oi)=>{
      let cls='opt';
      if(picked!==undefined){
        if(oi===q.a)cls+=' correct';
        else if(oi===picked)cls+=' wrong';
        else cls+=' muted';
      }
      h+='<button class="'+cls+'" data-q="'+qi+'" data-i="'+oi+'"'
       +(picked!==undefined?' disabled':'')+'>'
       +'<span class="n">'+'ABC'[oi]+'</span>'+esc(o)+'</button>';
    });
    h+='</div></div>';
  });
  const answered=Object.keys(rd.ans).length;
  h+='</div><div class="actions">'
   +'<button class="btn primary" id="fin">'+(answered>=r.qs.length?'完成':'已答 '+answered+' / '+r.qs.length+' 题')+'</button>'
   +'</div>';
  app.innerHTML=h;
  bindBack(()=>{rd=null;go('readings');});
  document.getElementById('tr').onclick=()=>{rd.showTr=true;render();};
  app.querySelectorAll('.opt[data-q]').forEach(b=>{
    b.onclick=()=>{
      const qi=+b.dataset.q;
      if(rd.ans[qi]!==undefined)return;
      rd.ans[qi]=+b.dataset.i;
      render();
    };
  });
  document.getElementById('fin').onclick=()=>{
    const right=r.qs.filter((q,qi)=>rd.ans[qi]===q.a).length;
    app.innerHTML=topbar(r.t,r.zh,true)
     +'<div class="stage"><div class="center" style="text-align:center">'
     +'<div class="de" style="font-size:32px">'+right+' / '+r.qs.length+'</div>'
     +'<div class="zh" style="margin-top:12px">'
     +(right===r.qs.length?'全部答对，这篇读懂了':'答对的题，回去看看原文的对应句子')+'</div>'
     +'</div></div><div class="actions"><button class="btn primary" id="bk2">回到文章列表</button></div>';
    bindBack(()=>{rd=null;go('readings');});
    document.getElementById('bk2').onclick=()=>{rd=null;go('readings');};
  };
}

/* ============================================================
   进度备份：导出/导入一串进度码
   进度存在浏览器本地，换设备、换浏览器、或在 file:// 下打开单文件版时
   都可能拿不到。一串可复制的码是唯一到处都可靠的办法。
   ============================================================ */
function storageAvailable(){
  try{
    localStorage.setItem('__t','1');
    const ok=localStorage.getItem('__t')==='1';
    localStorage.removeItem('__t');
    return ok;
  }catch(e){ return false; }
}
let STORAGE_OK = storageAvailable();

function exportCode(){
  const parts=[];
  Object.keys(S.g).forEach(k=>{
    const st=S.g[k]; if(!st)return;
    if(st.dots||st.seen) parts.push(k.slice(1)+':'+(st.dots||0));
  });
  const cfg=[S.set.article?1:0, S.set.strict?1:0, S.set.allOpen?1:0,
             S.set.rate===0.85?'a':S.set.rate===0.6?'b':'c'].join('');
  return 'DT1.'+cfg+'.'+parts.join(',');
}
function importCode(code){
  const m=String(code||'').trim().match(/^DT1\.([0-9ab]{4})\.(.*)$/);
  if(!m) throw new Error('格式不对，请完整复制整串进度码');
  const cfg=m[1], g={};
  const body=m[2].trim();
  if(body){
    body.split(',').forEach(p=>{
      const a=p.split(':');
      const i=parseInt(a[0],10);
      if(!isNaN(i)&&i>=0){
        g['g'+i]={dots:Math.max(0,Math.min(PASSES,parseInt(a[1],10)||0)),seen:true,w:{}};
      }
    });
  }
  return {g:g, set:{article:cfg[0]==='1',strict:cfg[1]==='1',allOpen:cfg[2]==='1',
          rate:cfg[3]==='a'?0.85:cfg[3]==='b'?0.6:0.45}};
}
function renderBackup(){
  const code=exportCode();
  let n=0; Object.keys(S.g).forEach(k=>{const st=S.g[k]; if(st&&(st.dots||st.seen))n++;});
  app.innerHTML=topbar('进度备份','Sicherung',true)
   +'<div class="note" style="padding-top:18px">进度存在这台设备的浏览器里。'
   +'换设备、换浏览器、或者改用在线的单文件版时，用下面这串码把进度搬过去。</div>'
   +'<div style="padding:6px var(--pad) 0">'
   +'<div class="hint" style="margin-bottom:6px">当前进度码（'+n+' 组有记录）</div>'
   +'<textarea class="input" id="exp" readonly style="height:104px;font-family:var(--font-mono);font-size:13px;line-height:1.5">'+esc(code)+'</textarea>'
   +'<div style="margin-top:10px"><button class="btn" id="cp">复制进度码</button></div>'
   +'</div>'
   +'<div style="padding:26px var(--pad) 0">'
   +'<div class="hint" style="margin-bottom:6px">导入：把进度码粘到这里</div>'
   +'<textarea class="input" id="imp" placeholder="DT1.1110.0:5,1:3" style="height:104px;font-family:var(--font-mono);font-size:13px;line-height:1.5"></textarea>'
   +'<div style="margin-top:10px"><button class="btn primary" id="do">导入并覆盖当前进度</button></div>'
   +'<div id="msg" class="hint" style="margin-top:12px"></div>'
   +'</div><div style="height:30px"></div>';
  bindBack(()=>go('home'));
  document.getElementById('cp').onclick=()=>{
    const t=document.getElementById('exp');
    let ok=false;
    try{
      t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0,999999);
      ok=document.execCommand('copy');
      t.setAttribute('readonly','readonly');
    }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(()=>{},()=>{});
      ok=true;
    }
    document.getElementById('cp').textContent = ok?'已复制到剪贴板':'请长按选中后复制';
  };
  document.getElementById('do').onclick=()=>{
    const msg=document.getElementById('msg');
    try{
      const d=importCode(document.getElementById('imp').value);
      S.g=d.g; S.set=d.set; save();
      msg.textContent='导入成功，进度已更新';
      msg.style.color='var(--ok)';
      setTimeout(()=>go('home'),800);
    }catch(e){
      msg.textContent='导入失败：'+e.message;
      msg.style.color='var(--no)';
    }
  };
}

/* ============================================================
   设置
   ============================================================ */
function openSettings(){
  let h=topbar('设置','Einstellungen',true)
   +'<div class="mode-list">'
   +'<button class="mode" id="t1"><span class="k">Aa</span><span class="body">'
   +'<span class="nm">名词必须带冠词</span><span class="sub">默写时 der / die / das 算错就整题算错　'
   +(S.set.article?'已开启':'已关闭')+'</span></span></button>'
   +'<button class="mode" id="t2"><span class="k">!</span><span class="body">'
   +'<span class="nm">严格模式</span><span class="sub">默写出错时掌握度清零重来　'
   +(S.set.strict?'已开启':'已关闭')+'</span></span></button>'
   +'<button class="mode" id="t3"><span class="k">♪</span><span class="body">'
   +'<span class="nm">语速</span><span class="sub">当前 '+(S.set.rate===0.85?'正常':S.set.rate===0.6?'慢速':'很慢')+'</span></span></button>'
   +'<button class="mode" id="t4"><span class="k">⇅</span><span class="body">'
   +'<span class="nm">解锁全部内容</span><span class="sub">跳过「五遍满分」的顺序限制，可以自由跳到任何一组　'
   +(S.set.allOpen?'已开启':'已关闭')+'</span></span></button>'
   +'</div>'
   +'<div class="note">严格模式关闭时，只有全对的一轮才计入掌握度，答错的那一轮不计入、也不清零。'
   +'解锁全开后仍建议按顺序练——后面的组会用到前面的词。</div>'
   +'<div class="mode-list" style="margin-top:14px">'
   +'<button class="mode" id="bk"><span class="k">⇄</span><span class="body">'
   +'<span class="nm">进度备份</span><span class="sub">导出一串进度码，换设备时搬过去</span></span></button>'
   +'<button class="mode" id="rs"><span class="k">↺</span><span class="body">'
   +'<span class="nm">清空全部进度</span><span class="sub">重新从第一组开始，无法撤销</span></span></button>'
   +'</div><div style="height:30px"></div>';
  app.innerHTML=h;
  bindBack(()=>go('home'));
  document.getElementById('t1').onclick=()=>{S.set.article=!S.set.article;save();openSettings();};
  document.getElementById('t2').onclick=()=>{S.set.strict=!S.set.strict;save();openSettings();};
  document.getElementById('t3').onclick=()=>{
    S.set.rate = S.set.rate===0.85?0.6:S.set.rate===0.6?0.45:0.85; save(); openSettings();
  };
  document.getElementById('t4').onclick=()=>{S.set.allOpen=!S.set.allOpen;save();openSettings();};
  document.getElementById('bk').onclick=()=>go('backup');
  document.getElementById('rs').onclick=()=>{
    if(confirm('确定清空全部学习进度？这个操作无法撤销。')){S=JSON.parse(JSON.stringify(DEF));save();go('home');}
  };
}

load();
render();
