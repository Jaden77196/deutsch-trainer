<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<title>Deutsch · 德语训练</title>
<style>
/* ============================================================
   设计系统
   冷调纸感（不用米色/奶油色）+ 深蓝墨色。
   唯一的高亮留给"掌握度"——五个圆点，呼应德语 Umlaut 的两点。
   名词按 der/die/das 上色，这是德语教材的通行做法，也是功能性的。
   ============================================================ */
:root{
  --paper:#EDEFF2; --paper-2:#E4E8ED; --paper-3:#DCE1E7;
  --ink:#1A222C; --ink-soft:#5C6875; --ink-faint:#8B96A3;
  --rule:#D2D8DF; --rule-soft:#E0E5EA;
  --accent:#2F4B8F; --accent-soft:#E2E8F5;
  --der:#2F4B8F; --die:#A63D52; --das:#3E7A5E;
  --ok:#3E7A5E; --ok-soft:#E1EEE7;
  --no:#A64B3C; --no-soft:#F6E4E0;
  --font-de:Georgia,'Times New Roman','Noto Serif','Source Han Serif SC',serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:10px;
  --pad:20px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12161C; --paper-2:#191E26; --paper-3:#212833;
    --ink:#E8ECF1; --ink-soft:#9AA5B2; --ink-faint:#6E7885;
    --rule:#2A313B; --rule-soft:#232A34;
    --accent:#7C9BD8; --accent-soft:#1B2434;
    --der:#7C9BD8; --die:#D98A9B; --das:#7FBF9C;
    --ok:#7FBF9C; --ok-soft:#16241D;
    --no:#D9948A; --no-soft:#2A1C19;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:16px;line-height:1.6;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px var(--pad) 12px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--paper);z-index:10;
}
.topbar .back{
  font-size:15px;color:var(--ink-soft);background:none;border:0;
  padding:10px 12px 10px 0;margin:0;cursor:pointer;font-family:inherit;
  min-width:44px;text-align:left;
}
.topbar .back:active{color:var(--ink)}
.topbar .title{flex:1;font-size:15px;font-weight:600;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .title small{display:block;font-weight:400;font-size:12px;color:var(--ink-faint);
  font-family:var(--font-de);font-style:italic;letter-spacing:.02em}

/* ---------- 掌握度：五个圆点 ---------- */
.dots{display:flex;gap:6px;align-items:center}
.dots i{
  width:9px;height:9px;border-radius:50%;background:transparent;
  border:1.5px solid var(--rule);display:block;transition:background .25s,border-color .25s,transform .25s;
}
.dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.dots i.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.7)}100%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.dots i,.dots i.pop{animation:none;transition:none}}

/* ---------- 舞台 ---------- */
.stage{flex:1;display:flex;flex-direction:column;padding:0 var(--pad)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center}

/* ---------- 德语词 ---------- */
.de{
  font-family:var(--font-de);font-weight:400;
  font-size:clamp(30px,9vw,44px);line-height:1.2;letter-spacing:-.01em;
  word-break:break-word;
}
.de.sm{font-size:clamp(22px,6.5vw,30px)}
.art{font-style:italic;font-weight:400}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
.hint{font-size:14px;color:var(--ink-faint);margin-top:8px;letter-spacing:.02em}
.zh{font-size:19px;color:var(--ink);margin-top:6px}
.zh.dim{color:var(--ink-soft)}

/* ---------- 例句 ---------- */
.ex{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule-soft)}
.ex .de{font-size:clamp(19px,5.4vw,23px);line-height:1.5}
.ex .zh{font-size:15px;color:var(--ink-soft);margin-top:8px}
.blank{
  display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);
  text-align:center;color:var(--accent);font-weight:600;
}
.fill{color:var(--ok);font-weight:600;border-bottom:2px solid var(--ok)}
.miss{color:var(--no);text-decoration:line-through;text-decoration-thickness:2px}

/* ---------- 按钮 ---------- */
.actions{display:flex;flex-direction:column;gap:10px;padding:22px 0 30px}
.btn{
  font-family:inherit;font-size:17px;font-weight:600;
  padding:16px 20px;border-radius:var(--r);border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
  min-height:56px;transition:background .15s,transform .1s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0F141A}}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1}

/* ---------- 选项 ---------- */
.opts{display:flex;flex-direction:column;gap:10px;padding:20px var(--pad) 26px}
.opt{
  font-family:inherit;font-size:17px;text-align:left;
  padding:15px 18px;border-radius:var(--r);border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
  min-height:56px;transition:background .15s,border-color .15s;
}
.opt .n{color:var(--ink-faint);margin-right:10px;font-variant-numeric:tabular-nums}
.opt:active{transform:scale(.99)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.opt.muted{opacity:.5}
.opt:disabled{cursor:default}

/* ---------- 输入 ---------- */
.input{
  font-family:var(--font-de);font-size:19px;
  width:100%;padding:16px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  min-height:56px;
}
.input:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.input::placeholder{color:var(--ink-faint);font-family:var(--font-ui);font-size:16px}
.specials{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.specials button{
  font-family:var(--font-de);font-size:19px;min-width:48px;min-height:44px;
  padding:6px 12px;border-radius:8px;border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
}
.specials button:active{background:var(--paper-3)}

/* ---------- 反馈 ---------- */
.judge{margin-top:16px;font-size:15px;line-height:1.6;padding:12px 14px;border-radius:var(--r)}
.judge.ok{background:var(--ok-soft);color:var(--ok)}
.judge.no{background:var(--no-soft);color:var(--no)}
.judge b{font-family:var(--font-de);font-size:17px}

/* ---------- 发音按钮 ---------- */
.speak{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-size:15px;color:var(--ink-soft);
  background:none;border:1px solid var(--rule);border-radius:999px;
  padding:10px 18px;margin-top:18px;cursor:pointer;min-height:44px;
}
.speak:active{background:var(--paper-2)}
.speak svg{width:17px;height:17px;flex:none}

/* ---------- 首页 ---------- */
.head{padding:26px var(--pad) 20px}
.head h1{font-family:var(--font-de);font-size:30px;margin:0;font-weight:400;letter-spacing:-.01em}
.head p{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
.lvhead{display:flex;align-items:center;gap:12px;padding:26px var(--pad) 9px}
.lvhead span:first-child{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:.08em}
.lvline{flex:1;height:1px;background:var(--rule-soft)}
.list{border-top:1px solid var(--rule)}
.item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px var(--pad);border:0;border-bottom:1px solid var(--rule);
  background:none;color:var(--ink);font-family:inherit;font-size:16px;cursor:pointer;
}
.item:active{background:var(--paper-2)}
.item .idx{
  font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);
  min-width:22px;font-variant-numeric:tabular-nums;
}
.item .body{flex:1;min-width:0}
.item .nm{font-size:16px;font-weight:500}
.item .nm small{display:block;font-family:var(--font-de);font-style:italic;
  font-weight:400;font-size:13px;color:var(--ink-faint);letter-spacing:.02em}
.item.locked{opacity:.42;cursor:default}
.item.locked:active{background:none}
.item.done .idx{color:var(--accent)}
.item .cnt{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.badge{
  font-size:11px;padding:2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;
}
.foot{padding:22px var(--pad) 34px;font-size:12px;color:var(--ink-faint);line-height:1.8}
.foot button{
  font-family:inherit;font-size:12px;color:var(--ink-faint);
  background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}

/* ---------- 阅读 ---------- */
.passage{font-family:var(--font-de);font-size:18px;line-height:1.75;letter-spacing:.005em}
.passage p{margin:0 0 1.1em}
.q{margin-top:26px;padding-top:20px;border-top:1px solid var(--rule-soft)}
.q .qt{font-size:16px;font-weight:600;margin-bottom:12px}
.q .qt small{display:block;font-family:var(--font-de);font-weight:400;
  font-size:15px;color:var(--ink-soft);margin-top:4px}
.trans{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule-soft);
  font-size:15px;color:var(--ink-soft);line-height:1.9}

/* ---------- 语法讲义卡片 ---------- */
.core{padding:24px var(--pad) 0;font-size:18px;line-height:1.8}
.core strong,.core b{color:var(--accent);font-weight:600}
.rtable{margin:22px var(--pad) 0;border-top:1px solid var(--rule)}
.rtable .r{padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.rtable .c1{font-size:13px;color:var(--ink-faint);line-height:1.5;margin-bottom:5px}
.rtable .c2{font-size:15px;line-height:1.6}
.rtable .c2 b{display:block;font-weight:600;color:var(--ink)}
.rtable .c2 b.g-der{color:var(--der)}
.rtable .c2 b.g-die{color:var(--die)}
.rtable .c2 b.g-das{color:var(--das)}
.rtable .c2 span{display:block;font-family:var(--font-de);font-size:14px;
  color:var(--ink-soft);margin-top:4px;line-height:1.55}
.regs{margin:22px var(--pad) 0}
.regs .e{padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.regs .e .de{font-family:var(--font-de);font-size:17px;line-height:1.5}
.regs .e .zh{font-size:14px;color:var(--ink-soft);margin-top:4px}
.rnote{margin:22px var(--pad) 0;padding:15px 17px;background:var(--paper-2);
  border-radius:var(--r);font-size:14px;line-height:1.85;color:var(--ink-soft)}
.rnote strong{color:var(--ink)}
.navrow{display:flex;gap:10px;padding:24px var(--pad) 8px}
.navrow .btn{flex:1;font-size:15px;padding:15px 10px;min-height:52px}

/* ---------- 进度条 ---------- */
.bar{height:2px;background:var(--rule-soft);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.mode-list{padding:8px 0 0}
.mode{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:17px var(--pad);border:0;border-bottom:1px solid var(--rule);
  background:none;color:var(--ink);font-family:inherit;cursor:pointer;
}
.mode:active{background:var(--paper-2)}
.mode .k{font-family:var(--font-de);font-size:20px;color:var(--ink-faint);min-width:26px}
.mode .body{flex:1}
.mode .nm{font-size:16px;font-weight:500}
.mode .sub{font-size:13px;color:var(--ink-faint);margin-top:2px}
.mode .arrow{color:var(--ink-faint);font-size:18px}
.note{padding:16px var(--pad) 0;font-size:13px;color:var(--ink-soft);line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==== content-a1.js ==== */
/* ============================================================
   A1 课程内容（完整）
   单词格式：[德语, 中文, 读音提示, 例句, 例句译文, 词性]
     - 名词带上冠词，如 'die Familie'
     - 例句用 { } 标出可挖空部分
     - 词性：n 名词 / v 动词 / a 形容词 / x 其他
   lv 表示 CEFR 等级
   ============================================================ */
window.CONTENT_A1 = [
{t:'问候与道别', lv:'A1', s:'Begrüßung', w:[
 ['Hallo','你好（随意）','哈洛','{Hallo}, ich bin Li.','你好，我是李。','x'],
 ['Guten Morgen','早上好','古腾 摩根','{Guten Morgen}, Frau Müller!','早上好，穆勒女士！','x'],

 ['Gute Nacht','晚安','古特 纳赫特','{Gute Nacht}, schlaf gut!','晚安，睡个好觉！','x'],
 ['Tschüss','再见（随意）','去斯','{Tschüss}, bis morgen!','再见，明天见！','x'],
 ['Auf Wiedersehen','再见（正式）','奥夫 维德泽恩','{Auf Wiedersehen}, Frau Doktor.','再见，博士女士。','x'],
 ['Danke','谢谢','当克','{Danke} für die Hilfe!','谢谢帮忙！','x'],
 ['Bitte','请／不客气','比特','{Bitte}, kommen Sie herein.','请进。','x'],
 ['Entschuldigung','对不起／劳驾','恩特舒尔迪贡','{Entschuldigung}, wo ist der Bahnhof?','劳驾，火车站在哪里？','x']
]},
{t:'认识与自我介绍', lv:'A1', s:'Sich vorstellen', w:[

 ['du','你（对熟人）','杜','Wie heißt {du}?','你叫什么名字？','x'],

 ['sein','是','再恩','Ich {bin} aus China.','我来自中国。','v'],

 ['das Land','国家','兰特','Aus welchem {Land} kommen Sie?','您来自哪个国家？','n'],
 ['die Sprache','语言','施普拉赫','Deutsch ist eine schöne {Sprache}.','德语是一门美丽的语言。','n']
]},
{t:'数字 0–12', lv:'A1', s:'Zahlen', w:[
 ['null','零','努尔','Die Temperatur ist {null} Grad.','温度是零度。','x'],
 ['eins','一','艾恩斯','Ich möchte {eins} von diesen.','我想要其中一个。','x'],
 ['zwei','二','次外','Ich habe {zwei} Schwestern.','我有两个姐妹。','x'],
 ['drei','三','德赖','Das kostet {drei} Euro.','这个三欧元。','x'],
 ['vier','四','菲尔','Wir sind {vier} Personen.','我们四个人。','x'],
 ['fünf','五','弗恩夫','Ich arbeite {fünf} Tage pro Woche.','我每周工作五天。','x'],
 ['sechs','六','泽克斯','Es ist {sechs} Uhr.','现在六点。','x'],
 ['sieben','七','济本','Die Woche hat {sieben} Tage.','一周有七天。','x'],
 ['acht','八','阿赫特','Ich stehe um {acht} Uhr auf.','我八点起床。','x'],
 ['neun','九','诺伊恩','Der Kurs beginnt um {neun}.','课程九点开始。','x'],
 ['zehn','十','岑','Ich zähle bis {zehn}.','我数到十。','x'],
 ['elf','十一','艾尔夫','Es ist {elf} Uhr.','现在十一点。','x'],
 ['zwölf','十二','次沃尔夫','Das Jahr hat {zwölf} Monate.','一年有十二个月。','x']
]},
{t:'数字 13–100', lv:'A1', s:'Zahlen II', w:[
 ['dreizehn','十三','德赖岑','Mein Bruder ist {dreizehn} Jahre alt.','我弟弟十三岁。','x'],
 ['vierzehn','十四','菲尔岑','Sie ist {vierzehn}.','她十四岁。','x'],
 ['fünfzehn','十五','弗恩夫岑','Das kostet {fünfzehn} Euro.','这个十五欧元。','x'],

]},
{t:'基础动词', lv:'A1', s:'Grundverben', w:[
 ['gehen','走，去','给恩','Ich {gehe} nach Hause.','我回家。','v'],
 ['sprechen','说，讲','施普雷贤','{Sprechen} Sie Deutsch?','您说德语吗？','v'],
 ['verstehen','理解','费施泰恩','Ich {verstehe} nicht.','我不明白。','v'],
 ['lernen','学习','雷恩恩','Ich {lerne} Deutsch.','我在学德语。','v'],
 ['arbeiten','工作','阿拜滕','Wo {arbeiten} Sie?','您在哪里工作？','v'],

]},
{t:'家庭', lv:'A1', s:'Die Familie', w:[
 ['die Familie','家庭','法米利厄','Meine {Familie} ist groß.','我的家庭很大。','n'],
 ['die Mutter','母亲','穆特','Meine {Mutter} kocht gut.','我妈妈做饭很好吃。','n'],
 ['der Vater','父亲','法特','Mein {Vater} arbeitet viel.','我爸爸工作很多。','n'],

{id:'r7', after:34, t:'Ein Umzug nach Berlin', zh:'搬去柏林',
 de:['Letzten Monat bin ich nach Berlin umgezogen. Die neue Wohnung liegt in einem ruhigen Stadtteil.',
     'Die Miete ist höher als vorher, aber die Wohnung hat einen Balkon und einen Aufzug.',
     'Am Anfang war mir die Stadt fremd. Ich kannte niemanden und musste mich erst anpassen.',
     'Inzwischen habe ich nette Nachbarn kennengelernt. Wir treffen uns manchmal im Hof und unterhalten uns.',
     'Ich habe mich an das Leben hier gewöhnt. Berlin gefällt mir immer besser.'],
 tr:'上个月我搬到了柏林。新公寓在一个安静的城区。租金比以前高，但公寓有阳台和电梯。一开始这座城市对我很陌生。我谁也不认识，得先适应。这期间我认识了不错的邻居。我们有时在院子里见面聊天。我已经习惯了这里的生活。柏林越来越让我喜欢。',
 qs:[
  {q:'新公寓在哪里？', de:'Wo liegt die neue Wohnung?', o:['市中心','一个安静的城区','火车站附近'], a:1},
  {q:'公寓的租金怎么样？', de:'Wie ist die Miete?', o:['比以前高','比以前低','一样'], a:0},
  {q:'作者刚到柏林时感觉如何？', de:'Wie war es am Anfang?', o:['很熟悉','很陌生','很无聊'], a:1},
  {q:'作者和邻居做什么？', de:'Was macht der Autor mit den Nachbarn?', o:['一起工作','偶尔在院子里聊天','一起去旅行'], a:1}

{id:'r8', after:40, t:'Umwelt im Alltag', zh:'日常中的环保',
 de:['Viele Menschen wollen die Umwelt schützen, aber im Alltag ist das nicht immer einfach.',
     'In Deutschland trennt man den Müll: Papier, Plastik, Glas und Restmüll kommen in verschiedene Tonnen.',
     'Manche Leute kaufen keine Plastiktüten mehr, sondern nehmen eigene Taschen mit.',
     'Auch beim Strom kann man sparen. Wer das Licht ausschaltet, wenn er den Raum verlässt, verbraucht weniger Energie.',
     'Kleine Gewohnheiten machen einen Unterschied. Wenn viele mitmachen, hat das großen Einfluss auf das Klima.'],
 tr:'很多人都想保护环境，但日常生活中并不总是容易。在德国人们做垃圾分类：纸、塑料、玻璃和其余垃圾放进不同的桶。有些人不买塑料袋了，而是自带袋子。用电也能节省。离开房间时关灯，就能少耗能源。小习惯也会带来改变。如果很多人一起做，对气候就有很大影响。',
 qs:[
  {q:'德国的垃圾怎么处理？', de:'Wie wird der Müll behandelt?', o:['全部一起扔','分类投放','只回收纸'], a:1},
  {q:'有些人购物时怎么做？', de:'Was machen manche beim Einkaufen?', o:['自带袋子','买更多塑料袋','不购物'], a:0},
  {q:'怎样节省电？', de:'Wie spart man Strom?', o:['离开房间时关灯','多开灯','用更多电器'], a:0},
  {q:'作者认为小习惯有用吗？', de:'Was denkt der Autor über kleine Gewohnheiten?', o:['没用','很有影响','只对个人有用'], a:1}
 ]},
{id:'r9', after:46, t:'Ein Bewerbungsgespräch', zh:'一次面试',
 de:['Frau Weber hat sich um eine Stelle beworben und ist zum Vorstellungsgespräch eingeladen worden.',
     'Der Chef fragt: „Warum möchten Sie bei uns arbeiten?" Sie antwortet: „Ihre Firma hat einen guten Ruf, und ich möchte mich weiterentwickeln."',

 tr:'韦伯女士申请了一个职位，被邀请去面试。上司问：「您为什么想在我们这里工作？」她回答：「贵公司声誉很好，我想继续发展。」然后他问她的经验。她解释说自己在类似领域工作了三年。最后她自己也问：「有哪些进修的机会？」上司很满意。两天后她收到了录用通知，签了合同。',
 qs:[
  {q:'韦伯女士为什么想去这家公司？', de:'Warum will Frau Weber dort arbeiten?', o:['工资高','公司声誉好','离家近'], a:1},
  {q:'她有多少年相关经验？', de:'Wie viel Erfahrung hat sie?', o:['一年','三年','十年'], a:1},
  {q:'她最后问了什么？', de:'Was fragt sie am Ende?', o:['进修的机会','工资多少','休假多久'], a:0},
  {q:'面试结果如何？', de:'Wie war das Ergebnis?', o:['她得到了职位','她被拒绝','她还在等'], a:0}

{id:'r10', after:55, t:'Stadt oder Land?', zh:'城市还是乡村？',
 de:['Die Frage, ob man lieber in der Stadt oder auf dem Land lebt, wird oft diskutiert. Beide Seiten haben Vorteile und Nachteile.',
     'In der Stadt gibt es mehr Arbeitsplätze, bessere Verkehrsmittel und ein größeres kulturelles Angebot. Wer Karriere machen will, ist hier oft im Vorteil.',
     'Allerdings sind die Mieten hoch, es ist laut, und viele Menschen fühlen sich einsam, obwohl sie von Leuten umgeben sind.',
     'Auf dem Land ist das Leben ruhiger und günstiger. Die Natur ist nah, und die Nachbarn kennen sich.',
     'Der Nachteil: Wer dort wohnt, braucht meistens ein Auto, und die Auswahl an Jobs ist begrenzt.',
     'Meiner Meinung nach kommt es darauf an, was einem wichtiger ist. Ich persönlich würde die Stadt vorziehen, solange ich jung bin.',
     'Später möchte ich vielleicht aufs Land ziehen. Man muss sich nicht für immer entscheiden.'],
 tr:'「更愿意住在城市还是乡村」这个问题经常被讨论。两边各有优劣。城市里工作机会更多、交通更好、文化生活更丰富。想发展事业的人在这里往往更有优势。不过租金高、嘈杂，而且很多人尽管被人群包围，却感到孤独。乡村生活更安静、更便宜。自然就在身边，邻居之间彼此认识。缺点是：住在那里通常需要一辆车，工作选择也有限。在我看来，这取决于什么对你更重要。就我个人而言，趁年轻我会更愿意选城市。以后也许我会搬到乡下去。人不必永远做出决定。',
 qs:[
  {q:'城市有哪些优势？', de:'Welche Vorteile hat die Stadt?', o:['更多工作机会和交通','更便宜','更安静'], a:0},
  {q:'城市生活的缺点是什么？', de:'Welche Nachteile hat die Stadt?', o:['租金高而且嘈杂','没有工作','自然太近'], a:0},
  {q:'住在乡下通常需要什么？', de:'Was braucht man auf dem Land meistens?', o:['一辆车','地铁','很多钱'], a:0},
  {q:'作者个人的倾向是什么？', de:'Was bevorzugt der Autor persönlich?', o:['年轻时选城市','一直住乡下','都不喜欢'], a:0}
 ]}
];

{id:'T2', lv:'A1', t:'规则动词现在时', s:'Regelmäßige Verben',

  {q:'Ich danke ___ Lehrer.', a:'dem', opts:['der','den','dem'], why:'阳性第三格 → dem。'},
  {q:'Das gehört ___ Familie.', a:'der', opts:['die','der','dem'], why:'阴性第三格 → der。'},
  {q:'Ich helfe ___ Studenten.', a:'dem', opts:['der','den','dem'], why:'阳性第三格 → dem。（单数 Student）'}
 ]},

{id:'T9', lv:'A1', t:'否定：kein 还是 nicht', s:'Negation',

{id:'T10', lv:'A1', t:'陈述句：动词坐第二把交椅', s:'Wortstellung im Aussagesatz',

 items:[
  {q:'Heute ___ ich nach Berlin.', a:'fahre', opts:['fahre','ich fahre','fahren'], why:'Heute 占第一位，动词必须第二位，主语后移。'},
  {q:'Ich ___ heute nach Berlin.', a:'fahre', opts:['fahre','fahren','fahre ich'], why:'主语开头时动词紧随其后。'},
  {q:'Am Montag ___ wir einen Termin.', a:'haben', opts:['haben','wir haben','hat'], why:'时间状语开头 → 动词第二位。'},
  {q:'Nach der Arbeit ___ ich müde.', a:'bin', opts:['bin','ich bin','ist'], why:'介词短语开头 → 动词第二位。'},
  {q:'Morgen ___ er nach Köln.', a:'fährt', opts:['fährt','er fährt','fahren'], why:'时间词开头 → 动词第二位，主语后移。'},
  {q:'Ich ___ heute keine Zeit.', a:'habe', opts:['habe','haben','habe ich'], why:'主语开头，动词紧随。'},
  {q:'In Berlin ___ viele Menschen.', a:'wohnen', opts:['wohnen','Menschen wohnen','wohnt'], why:'地点开头 → 动词第二位。'},

 ]},

 ],
 egs:[['Ich freue mich auf den Urlaub.','我期待假期。'],['Beeilt euch!','你们快点！']],
 note:'怎么判断用第四格还是第三格反身代词？<strong>句子里已经有第四格宾语了，反身代词就用第三格。</strong>Ich wasche mich（没别的宾语 → 四格）；Ich wasche <strong>mir</strong> die Hände（die Hände 是四格 → 反身用三格）。',
 items:[
  {q:'Ich freue ___ auf den Urlaub.', a:'mich', opts:['mich','mir','sich'], why:'ich 的反身代词是 mich（第四格）。'},
  {q:'Wie fühlst du ___?', a:'dich', opts:['dich','dir','sich'], why:'du 配 dich。'},
  {q:'Er interessiert ___ für Musik.', a:'sich', opts:['sich','ihm','ihn'], why:'er/sie/es 的反身代词都是 sich。'},
  {q:'Wir treffen ___ um acht.', a:'uns', opts:['uns','euch','sich'], why:'wir 配 uns。'},
  {q:'Beeilt ___ bitte!', a:'euch', opts:['euch','uns','sich'], why:'ihr 配 euch。'},
  {q:'Ich muss ___ noch duschen.', a:'mich', opts:['mich','mir','sich'], why:'sich duschen，ich 用 mich。'},
  {q:'Ich wasche ___ die Hände.', a:'mir', opts:['mich','mir','sich'], why:'die Hände 已经是第四格宾语 → 反身代词用第三格 mir。'},
  {q:'Sie (复数) freuen ___ auf das Fest.', a:'sich', opts:['sich','sie','ihnen'], why:'第三人称复数反身代词仍是 sich。'}
 ]},

{id:'T25', lv:'A2', t:'人称代词的三格和四格', s:'Personalpronomen',
 core:'人称代词也有格的变化。<strong>只有 er 和 du/ich 变化明显</strong>，其他多数第二、三格长得像。',
 rows:[
  ['第一格','ich · du · er · sie · es · wir · ihr · sie · Sie','谁在做'],
  ['第四格','mich · dich · <strong>ihn</strong> · sie · es · uns · euch · sie · Sie','动作落在谁身上'],
  ['第三格','mir · dir · <strong>ihm</strong> · <strong>ihr</strong> · ihm · uns · euch · <strong>ihnen</strong> · Ihnen','给谁']
 ],
 egs:[['Ich sehe ihn.','我看见他。'],['Ich helfe ihm.','我帮他。']],
 note:'最容易混的两组：<strong>er → ihn（四格）/ ihm（三格）</strong>；<strong>sie（她）→ sie（四格）/ ihr（三格）</strong>。另外复数「他们」的第三格是 <strong>ihnen</strong>，别和 ihr 搞混。',
 items:[
  {q:'Ich sehe ___. (er)', a:'ihn', opts:['er','ihn','ihm'], why:'er 的第四格是 ihn。'},
  {q:'Ich helfe ___. (er)', a:'ihm', opts:['ihn','ihm','ihr'], why:'helfen 配第三格 → ihm。'},
  {q:'Ich sehe ___. (sie 她)', a:'sie', opts:['sie','ihr','ihn'], why:'sie（她）第四格不变，仍是 sie。'},
  {q:'Ich danke ___. (sie 她)', a:'ihr', opts:['sie','ihr','ihm'], why:'danken 配第三格，sie（她）→ ihr。'},
  {q:'Kannst du ___ helfen? (ich)', a:'mir', opts:['mich','mir','ich'], why:'helfen 配第三格 → mir。'},
  {q:'Ich rufe ___ morgen an. (du)', a:'dich', opts:['du','dich','dir'], why:'anrufen 支配第四格 → dich。'},
  {q:'Ich gebe ___ das Buch. (sie 复数)', a:'ihnen', opts:['sie','ihnen','ihr'], why:'复数「他们」的第三格是 ihnen。'},
  {q:'Ich sehe ___. (wir)', a:'uns', opts:['wir','uns','euch'], why:'wir 的第四格是 uns（和第三格同形）。'}
 ]},

{id:'T26', lv:'A2', t:'时间介词：am / im / um / vor / nach / seit', s:'Zeitpräpositionen',
 core:'说时间用哪个介词，<strong>看后面跟的是什么类型的时间词</strong>，规则很死。',
 rows:[
  ['am','+ 星期、日期、一天中的时段','am Montag · am 3. Mai · am Abend'],
  ['im','+ 月份、季节、年份','im Mai · im Sommer · im Jahr 2026'],
  ['um','+ 钟点','um acht Uhr'],
  ['vor','+ 第三格，在…之前','vor dem Essen 饭前'],
  ['nach','+ 第三格，在…之后','nach der Arbeit 下班后'],
  ['seit','+ 第三格，自从','seit einer Woche 一周以来']
 ],
 egs:[['Am Montag habe ich frei.','周一我休息。'],['Nach der Arbeit gehe ich einkaufen.','下班后我去买东西。']],
 note:'三个最容易错的：<strong>am Abend 但 in der Nacht</strong>（夜晚用 in）；<strong>im Jahr 2026 但 2026 单独说时不用介词</strong>；<strong>seit 后面必须是第三格</strong>，而且它只能配现在还持续的事。',
 items:[
  {q:'___ Montag habe ich frei.', a:'Am', opts:['Am','Im','Um'], why:'星期前用 am。'},
  {q:'___ Sommer fahren wir ans Meer.', a:'Im', opts:['Am','Im','Um'], why:'季节前用 im。'},
  {q:'Der Kurs beginnt ___ acht Uhr.', a:'um', opts:['am','im','um'], why:'钟点前用 um。'},
  {q:'___ der Arbeit gehe ich nach Hause.', a:'Nach', opts:['Vor','Nach','Seit'], why:'nach + 第三格 = 之后。'},
  {q:'Ich lerne ___ einem Jahr Deutsch.', a:'seit', opts:['vor','nach','seit'], why:'seit + 第三格 = 自从（持续至今）。'},
  {q:'___ dem Essen trinken wir Kaffee.', a:'Nach', opts:['Nach','Seit','Um'], why:'饭后 → nach dem Essen。'},
  {q:'___ Mai ist es warm.', a:'Im', opts:['Am','Im','Um'], why:'月份前用 im。'},
  {q:'___ Abend sehe ich fern.', a:'Am', opts:['Am','Im','Um'], why:'一天中的时段用 am（但 in der Nacht 是例外）。'}
 ]},

{id:'T27', lv:'B1', t:'虚拟式 II：客气话的万能公式', s:'Konjunktiv II',
 core:'两个用途：让请求<strong>变客气</strong>，说<strong>非现实的假设</strong>。靠几个固定词就能全部搞定。',
 rows:[
  ['würde + 原形','最万能，任何动词都能用','Ich würde gern mitkommen. 我很乐意一起来'],
  ['hätte','haben 的虚拟式','Ich hätte gern einen Kaffee. 我想要杯咖啡'],
  ['wäre','sein 的虚拟式','Das wäre schön. 那就太好了'],
  ['könnte','können 的虚拟式','Könnten Sie mir helfen? 您能帮我吗'],
  ['非现实假设','wenn + 虚拟式','Wenn ich Zeit hätte, käme ich mit. 如果我有时间就来了']
 ],
 egs:[['Könnten Sie das wiederholen?','您能重复一遍吗？'],['An deiner Stelle würde ich mehr lernen.','我要是你就多学点。']],
 note:'最实用的一条：<strong>把 Können 换成 Könnten，礼貌程度立刻上一个台阶。</strong>德国人问路、点单、提要求几乎都用 Könnten。注意它和过去时 konnte 只差一个变音，意思完全不同。',
 items:[
  {q:'___ Sie mir bitte helfen?', a:'Könnten', opts:['Können','Könnten','Konnten'], why:'Könnten 比 Können 客气得多。'},
  {q:'Ich ___ gern ein Zimmer reservieren.', a:'würde', opts:['werde','würde','wurde'], why:'würde + 不定式是最常用的委婉表达。'},
  {q:'Wenn ich Zeit ___, käme ich mit.', a:'hätte', opts:['hatte','hätte','habe'], why:'hätte 是 haben 的虚拟式。'},
  {q:'Wenn ich reich ___, würde ich reisen.', a:'wäre', opts:['war','wäre','bin'], why:'wäre 是 sein 的虚拟式。'},
  {q:'Ich ___ lieber Tee als Kaffee.', a:'hätte', opts:['habe','hätte','hatte'], why:'hätte gern / hätte lieber 是表达偏好的黄金句型。'},
  {q:'An deiner Stelle ___ ich mehr lernen.', a:'würde', opts:['werde','würde','wurde'], why:'「如果我是你」用 würde。'},
  {q:'___ es möglich, dass Sie später kommen?', a:'Wäre', opts:['War','Wäre','Ist'], why:'Wäre es möglich... 是礼貌询问「有可能……吗」。'},
  {q:'___ Sie mir den Weg zeigen?', a:'Könnten', opts:['Können','Könnten','Konnten'], why:'问路时用 Könnten 礼貌很多。'}
 ]},

{id:'T28', lv:'B1', t:'连接词分三类，语序各不同', s:'Konnektoren',
 core:'拿到一个连接词，先问：<strong>它占不占句首的位置？</strong>三类词的语序完全不同。',
 rows:[
  ['不占位置','und · aber · oder · denn','语序完全不变'],
  ['占第一位','deshalb 所以 · trotzdem 尽管如此 · dann 然后 · also 因此','动词紧随其后，主语后移'],
  ['引导从句','weil 因为 · obwohl 虽然 · dass 那 · wenn 如果','动词滚到从句末尾']
 ],
 egs:[['Es regnet, deshalb bleibe ich zu Hause.','下雨，所以我待在家。'],['Ich bleibe zu Hause, weil es regnet.','我待在家，因为下雨。']],
 note:'同一个意思，用 deshalb 和用 weil，句子结构完全相反：<strong>deshalb 后面动词紧跟，weil 后面动词垫底。</strong>记住这一对，这一类就通了。',
 items:[
  {q:'Es regnet, ___ ich bleibe zu Hause.', a:'deshalb', opts:['deshalb','weil','und'], why:'deshalb 占第一位，后面紧跟动词，主语后移。'},
  {q:'Ich bleibe zu Hause, ___ es regnet.', a:'weil', opts:['deshalb','weil','aber'], why:'weil 引导从句，动词 regnet 去末尾。'},
  {q:'Es regnet, ___ gehe ich spazieren.', a:'trotzdem', opts:['trotzdem','weil','deshalb'], why:'trotzdem 表让步，占第一位，动词第二位。'},
  {q:'Ich mag Tee, ___ ich trinke lieber Kaffee.', a:'aber', opts:['aber','deshalb','weil'], why:'aber 是并列连词，不占位置。'},
  {q:'Er ist müde, ___ er arbeitet weiter.', a:'obwohl', opts:['obwohl','deshalb','und'], why:'obwohl 引导从句，动词去末尾。'},
  {q:'Zuerst esse ich, ___ gehe ich zur Arbeit.', a:'dann', opts:['dann','weil','obwohl'], why:'dann 占第一位，动词紧随其后。'},
  {q:'Ich lerne Deutsch, ___ ich in Berlin arbeiten will.', a:'weil', opts:['weil','deshalb','aber'], why:'表原因的从句用 weil，动词到末尾。'},
  {q:'Er hat viel gelernt, ___ hat er die Prüfung bestanden.', a:'deshalb', opts:['deshalb','obwohl','aber'], why:'前因后果用 deshalb，并引起主谓倒装。'}
 ]},

{id:'T29', lv:'B1', t:'关系从句：性别跟名词，格看成分', s:'Relativsatz',
 core:'两个判断：关系代词的<strong>性别和单复数跟着前面那个名词</strong>，<strong>格看它在从句里干什么活儿</strong>。',
 rows:[
  ['做主语','第一格','Der Mann, <strong>der</strong> dort steht, … 站在那儿的男人'],
  ['做第四格宾语','第四格','Die Frau, <strong>die</strong> ich traf, … 我遇到的那位女士'],
  ['做第三格宾语','第三格','Der Freund, <strong>dem</strong> ich helfe, … 我帮的那位朋友'],
  ['带介词','介词决定格','Die Stadt, in <strong>der</strong> ich wohne, … 我住的城市']
 ],
 egs:[['Das Buch, das ich lese, ist spannend.','我在读的这本书很精彩。'],['Der Kollege, mit dem ich arbeite, ist nett.','跟我共事的同事人很好。']],
 note:'别忘了从句的老规矩：<strong>动词去末尾</strong>。「Der Mann, der dort <strong>steht</strong>」——steht 在最末尾。上面例子里逗号后的部分整个是修饰语，插在句子中间。',
 items:[
  {q:'Der Mann, ___ dort steht, ist mein Chef.', a:'der', opts:['der','den','dem'], why:'Mann 阳性，在从句里做主语 → 第一格 der。'},
  {q:'Die Frau, ___ ich gestern traf, ist Ärztin.', a:'die', opts:['die','der','den'], why:'Frau 阴性，做第四格宾语 → die（阴性四格同形）。'},
  {q:'Das Buch, ___ ich lese, ist spannend.', a:'das', opts:['das','den','dem'], why:'Buch 中性，第四格 → das。'},
  {q:'Der Freund, ___ ich helfe, wohnt hier.', a:'dem', opts:['der','den','dem'], why:'helfen 支配第三格 → 阳性第三格 dem。'},
  {q:'Die Stadt, in ___ ich wohne, ist schön.', a:'der', opts:['die','der','dem'], why:'in + 在哪里 → 第三格，Stadt 阴性 → der。'},
  {q:'Der Kollege, mit ___ ich arbeite, ist nett.', a:'dem', opts:['der','den','dem'], why:'mit 固定第三格 → dem。'},
  {q:'Die Kinder, ___ im Garten spielen, sind laut.', a:'die', opts:['die','den','der'], why:'复数第一格 → die。'},
  {q:'Das Haus, ___ wir gekauft haben, ist alt.', a:'das', opts:['das','dem','den'], why:'中性第四格 → das。'}
 ]},

{id:'T30', lv:'B1', t:'被动语态：werden + 过去分词', s:'Passiv',
 core:'公式只有一个：<strong>werden + 过去分词</strong>。过去时换成 wurde，其余不变。',
 rows:[
  ['现在时','Das Haus <strong>wird</strong> gebaut.','这房子在建'],
  ['过去时','Das Haus <strong>wurde</strong> gebaut.','这房子（当时）在建'],
  ['带情态动词','Das Haus <strong>muss</strong> gebaut <strong>werden</strong>.','这房子必须建'],
  ['施动者用 von','Das wurde <strong>von</strong> meinem Vater repariert.','这是我爸修的']
 ],
 egs:[['Hier wird Deutsch gesprochen.','这里说德语。'],['Die Briefe werden jeden Tag gebracht.','信件每天送来。']],
 note:'口语里德国人更爱用 <strong>man</strong> 代替被动：不用「Das wird gemacht」，直接说「<strong>Man macht das</strong>」，意思一样还省事。但书面语和考试要能看懂被动。',
 items:[
  {q:'Das Haus ___ 1990 gebaut.', a:'wurde', opts:['wurde','wird','ward'], why:'过去时的被动：wurde + 过去分词。'},
  {q:'Die Briefe ___ jeden Tag gebracht.', a:'werden', opts:['werden','wird','wurden'], why:'复数主语用 werden（现在时被动）。'},
  {q:'Das Auto ___ von meinem Vater repariert.', a:'wurde', opts:['wurde','wird','war'], why:'被动 + von 引出施动者。'},
  {q:'Hier ___ Deutsch gesprochen.', a:'wird', opts:['wird','werden','wurde'], why:'单数主语，现在时被动 → wird。'},
  {q:'Die Prüfung ___ nächste Woche geschrieben.', a:'wird', opts:['wird','werden','wurde'], why:'将来发生的被动，用现在时被动表达即可。'},
  {q:'Das Problem ___ schnell gelöst.', a:'wurde', opts:['wurde','wird','war'], why:'已完成的被动动作 → wurde。'},
  {q:'In Deutschland ___ viel Bier getrunken.', a:'wird', opts:['wird','werden','wurde'], why:'Bier 不可数，视为单数 → wird。'},
  {q:'Die Kinder ___ von der Lehrerin betreut.', a:'werden', opts:['werden','wird','wurden'], why:'复数主语 + 现在时 → werden。'}
 ]},

{id:'T31', lv:'B1', t:'带 zu 的不定式：zu 插在中间', s:'Infinitiv mit zu',
 core:'很多动词后面接「<strong>zu + 原形</strong>」。可分动词的话，<strong>zu 插在前缀和词干中间</strong>。',
 rows:[
  ['普通动词','zu + 原形','Ich habe Lust, ins Kino <strong>zu gehen</strong>.'],
  ['可分动词','zu 插进中间','Ich versuche, früher <strong>aufzustehen</strong>.'],
  ['常见搭配','Lust haben 有兴趣 · Zeit haben 有时间 · versuchen 尝试 · vergessen 忘记 · bitten 请求','全都 + zu + 不定式'],
  ['对比','情态动词<strong>不带</strong> zu','Ich muss gehen.（不是 zu gehen）']
 ],
 egs:[['Ich habe keine Zeit zu kommen.','我没时间来。'],['Er hat vergessen, mich anzurufen.','他忘了给我打电话。']],
 note:'一个硬规矩：<strong>情态动词不带 zu</strong>（Ich muss gehen），<strong>普通动词要带 zu</strong>（Ich versuche zu gehen）。可分动词就把 zu 塞进去：an<strong>zu</strong>rufen、auf<strong>zu</strong>stehen。',
 items:[
  {q:'Ich habe Lust, ins Kino ___.', a:'zu gehen', opts:['zu gehen','gehen zu','zu gegangen'], why:'Lust haben + zu + 不定式。'},
  {q:'Es ist wichtig, jeden Tag ___.', a:'zu üben', opts:['zu üben','üben zu','geübt'], why:'Es ist wichtig + zu + 不定式。'},
  {q:'Ich versuche, früher ___.', a:'aufzustehen', opts:['aufzustehen','zu aufstehen','aufstehen zu'], why:'可分动词：zu 插在 auf 和 stehen 中间。'},
  {q:'Er hat vergessen, mich ___.', a:'anzurufen', opts:['anzurufen','zu anrufen','anrufen zu'], why:'可分动词 anrufen → anzurufen。'},
  {q:'Ich freue mich darauf, dich ___.', a:'zu sehen', opts:['zu sehen','sehen zu','gesehen'], why:'sich freuen auf + zu + 不定式。'},
  {q:'Sie hat keine Zeit, ___.', a:'zu kommen', opts:['zu kommen','kommen zu','gekommen'], why:'Zeit haben + zu + 不定式。'},
  {q:'Ich muss jetzt ___.', a:'gehen', opts:['zu gehen','gehen','gegangen'], why:'情态动词不带 zu。'},
  {q:'Ich bitte dich, mir ___.', a:'zu helfen', opts:['zu helfen','helfen zu','geholfen'], why:'bitten + zu + 不定式。'}
 ]},

{id:'T32', lv:'B1', t:'第二格：口语能绕就绕', s:'Genitiv',
 core:'第二格表示「谁的」，书面气重。<strong>口语里德国人几乎都用 von + 第三格代替。</strong>',
 rows:[
  ['书面 / 第二格','das Auto <strong>des</strong> Mannes','那个男人的车（阳性名词还要加 -es）'],
  ['口语 / von + 三格','das Auto <strong>von dem</strong> Mann','意思完全一样'],
  ['人名最省事','<strong>Christinas</strong> Auto','克里斯蒂娜的车（直接加 s）'],
  ['阴性中性','die Farbe <strong>der</strong> Wand · die Tür <strong>des</strong> Hauses','']
 ],
 egs:[['Das ist das Auto meines Vaters.','这是我爸爸的车。'],['Wegen des Wetters bleiben wir hier.','因为天气我们留在这儿。']],
 note:'有几个介词后面<strong>必须</strong>用第二格，躲不掉，考试也常考：<strong>wegen 因为、trotz 尽管、während 在…期间</strong>。其他场合你用 von 绕过去，德国人完全听得懂。',
 items:[
  {q:'Das ist das Auto ___ Mannes.', a:'des', opts:['des','dem','der'], why:'Mannes 是阳性第二格，冠词 des，名词加 -es。'},
  {q:'Die Farbe ___ Wand ist weiß.', a:'der', opts:['der','die','des'], why:'Wand 阴性，第二格用 der。'},
  {q:'Die Tür ___ Hauses ist offen.', a:'des', opts:['des','dem','der'], why:'Haus 中性，第二格 des。'},
  {q:'Das ist die Tasche ___ Frau.', a:'der', opts:['der','die','des'], why:'Frau 阴性，第二格 der（名词不加 -s）。'},
  {q:'Wegen ___ Wetters bleiben wir hier.', a:'des', opts:['des','dem','der'], why:'wegen 支配第二格，Wetter 中性 → des。'},
  {q:'Die Meinung ___ Leute ist wichtig.', a:'der', opts:['der','die','den'], why:'复数第二格用 der。'},
  {q:'Trotz ___ Regens gingen wir spazieren.', a:'des', opts:['des','dem','den'], why:'trotz 支配第二格。'},
  {q:'Das Ende ___ Films war traurig.', a:'des', opts:['des','dem','der'], why:'Film 阳性第二格 → des。'}
 ]},

{id:'T33', lv:'B1', t:'别逐字翻译中文', s:'Nicht wörtlich übersetzen',
 core:'很多错句不是语法不会，是<strong>把中文的词一个个搬过去</strong>。这些是最高频的翻车点。',
 rows:[
  ['我很热','Ich bin heiß ✗','Mir ist warm ✓（德语用第三格说感受）'],
  ['我喜欢','没有「喜欢」这个动词','Ich mag … / Ich … gern ✓'],
  ['我同意你','','Ich stimme dir zu ✓（zu 在末尾，可分动词）'],
  ['这对我很难','','Das ist schwer für mich ✓（für + 第四格）'],
  ['我有兴趣','','Ich habe Interesse an … ✓（不是 Interesse 单独用）']
 ],
 egs:[['Mir ist kalt.','我冷。（不是 Ich bin kalt）'],['Ich stimme dir zu.','我同意你。']],
 note:'另一个重灾区：<strong>「是」不要滥用</strong>。中文「我很累」是 Ich bin müde，但中文「我饿了」不能说 Ich bin hungrig 之外的 Ich habe Hunger——<strong>德语说身体感受多用 Mir ist … 或 Ich habe …</strong>，而不是 Ich bin …。',
 items:[
  {q:'「我很热」→ ___', a:'Mir ist warm.', opts:['Ich bin warm.','Mir ist warm.','Ich habe warm.'], why:'德语说身体感受用第三格：Mir ist warm / kalt / schlecht。'},
  {q:'「我饿了」→ ___', a:'Ich habe Hunger.', opts:['Ich bin Hunger.','Ich habe Hunger.','Mir ist Hunger.'], why:'饥饿、口渴、恐惧这类用 haben：Hunger / Durst / Angst haben。'},
  {q:'「我同意你」→ ___', a:'Ich stimme dir zu.', opts:['Ich stimme dir.', 'Ich stimme dir zu.','Ich bin einverstanden dich.'], why:'zustimmen 是可分动词，zu 必须在末尾。'},
  {q:'「我喜欢喝茶」→ ___', a:'Ich trinke gern Tee.', opts:['Ich mag trinken Tee.','Ich trinke gern Tee.','Ich bin gern Tee.'], why:'德语没有单独的「喜欢」动词，用 gern 或 mögen。'},
  {q:'「这对我来说很难」→ ___', a:'Das ist schwer für mich.', opts:['Das ist schwer zu mich.','Das ist schwer für mich.','Das ist schwer an mich.'], why:'「对某人来说」用 für + 第四格。'},
  {q:'「我冷」→ ___', a:'Mir ist kalt.', opts:['Ich bin kalt.','Mir ist kalt.','Ich habe kalt.'], why:'说「我冷」用 Mir ist kalt；Ich bin kalt 意思是「我这个人很冷淡」。'},
  {q:'「我对音乐感兴趣」→ ___', a:'Ich interessiere mich für Musik.', opts:['Ich bin interessiert Musik.','Ich interessiere mich für Musik.','Ich habe Interesse Musik.'], why:'sich interessieren für + 第四格。'},
  {q:'「这取决于天气」→ ___', a:'Das hängt vom Wetter ab.', opts:['Das kommt vom Wetter.', 'Das hängt vom Wetter ab.','Das ist vom Wetter.'], why:'abhängen von，可分动词前缀 ab 在末尾。'}
 ]}
];

</script>
<script>
/* ============================================================
   课程内容
   单词格式：[德语, 中文, 读音提示, 例句, 例句译文, 词性]
     - 名词在德语里带上冠词，如 'die Familie'，程序会自动解析词性颜色
     - 例句里用 { } 标出可以挖空的部分（用变位后的形式，如 {bin}）
     - 词性：n 名词 / v 动词 / a 形容词 / x 其他
   要加新词，直接在对应的 w 数组里加一行即可。
   ============================================================ */
const GROUPS = [].concat(
  window.CONTENT_A1||[], window.CONTENT_A2||[], window.CONTENT_B1||[],
  window.CONTENT_PHRASES||[], window.CONTENT_B2||[]
);
const TOPICS = [].concat(window.CONTENT_TOPICS_A||[], window.CONTENT_TOPICS_B||[]);

/* 阅读理解：难度递进，after 表示学完第几组后解锁 */
const READINGS = window.CONTENT_READINGS || [];

/* ============================================================
   应用逻辑
   ============================================================ */
const KEY='deutsch.v1';
const PASSES=5;                 // 满分几遍解锁下一组
const DEF={g:{},set:{article:true,strict:true,rate:0.85,allOpen:false}};
let S=JSON.parse(JSON.stringify(DEF));

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const p=JSON.parse(r);S.g=p.g||{};S.set=Object.assign({},DEF.set,p.set||{});}
  }catch(e){}
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function gs(i){ // group state
  const k='g'+i;
  if(!S.g[k])S.g[k]={dots:0,seen:false,w:{}};
  return S.g[k];
}
function unlocked(i){ return S.set.allOpen || i===0 || gs(i-1).dots>=PASSES; }
function mastered(i){ return gs(i).dots>=PASSES; }

/* ---------- 工具 ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 解析单词 ---------- */
function pw(w){
  const [de,zh,hint,ex,exZh,type]=w;
  let art=null,bare=de;
  const m=de.match(/^(der|die|das)\s+(.+)$/i);
  if(m){art=m[1].toLowerCase();bare=m[2];}
  const bm=ex.match(/\{([^}]*)\}/);
  const blank=bm?bm[1]:null;
  const parts=ex.split(/\{[^}]*\}/);
  return {de,bare,art,zh,hint,ex,exZh,type,blank,parts};
}
/* 句子用 HTML 还原：fill=填入的词（高亮），null=显示下划线空位 */
function sentHTML(p,fill){
  if(!p.blank)return esc(p.ex);
  const mid = fill===null ? '<span class="blank">&nbsp;&nbsp;&nbsp;</span>'
    : (fill===false ? '<span class="blank">&nbsp;&nbsp;&nbsp;</span>'
    : '<span class="fill">'+esc(fill)+'</span>');
  return esc(p.parts[0])+mid+esc(p.parts[1]||'');
}
/* 词性色 */
function artClass(a){return a==='der'?'der':a==='die'?'die':a==='das'?'das':'';}

/* ============================================================
   语音合成（德语 TTS）
   ============================================================ */
let deVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices()||[];
  deVoice = vs.find(v=>/^de([-_]|$)/i.test(v.lang)&&/google|premium|enhanced|siri/i.test(v.name))
         || vs.find(v=>/^de([-_]|$)/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(text,rate){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=rate||S.set.rate;
    if(!deVoice)pickVoice();
    if(deVoice)u.voice=deVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
const SPEAK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ============================================================
   路由
   ============================================================ */
let route={v:'home'};
let ses=null;   // 当前练习会话
let rd=null;    // 阅读理解状态（独立于 ses，否则会劫持 render() 的路由分发）
const app=document.getElementById('app');

function go(v,extra){
  route=Object.assign({v},extra||{});
  render();
  window.scrollTo(0,0);
}

function render(){
  if(ses)      renderSession();
  else if(route.v==='home')     renderHome();
  else if(route.v==='group')    renderGroup(route.i);
  else if(route.v==='readings') renderReadings();
  else if(route.v==='reading')  renderReading(route.id);
  else if(route.v==='topics')   renderTopicList();
  else if(route.v==='topic')    renderTopic(route.i);
  else if(route.v==='backup')   renderBackup();
}

function topbar(title,sub,back){
  return '<div class="topbar">'
   +(back?'<button class="back" id="bk">← 返回</button>':'')
   +'<div class="title">'+esc(title)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'
   +'</div>';
}
function bindBack(fn){
  const b=document.getElementById('bk');
  if(b)b.onclick=fn;
}

/* ============================================================
   首页
   ============================================================ */
function renderHome(){
  const levels=[...new Set(GROUPS.map(g=>g.lv||'A1'))];
  let done=0;
  GROUPS.forEach((g,i)=>{if(mastered(i))done++;});
  let h='<div class="head"><h1>Deutsch</h1>'
   +'<p>已掌握 '+done+' / '+GROUPS.length+' 组　·　每组五遍满分解锁下一组</p></div>';
  if(!STORAGE_OK){
    h+='<div class="note" style="color:var(--no);padding-top:0;padding-bottom:4px">'
     +'⚠️ 这个浏览器不让本地文件保存数据，进度关掉页面就会丢。'
     +'建议改用在线版，或者每次练完到「设置 → 进度备份」复制进度码存下来。</div>';
  }
  levels.forEach(lv=>{
    h+='<div class="lvhead"><span>'+esc(lv)+'</span><span class="lvline"></span></div><div class="list">';
    GROUPS.forEach((g,i)=>{
      if((g.lv||'A1')!==lv)return;
      const st=gs(i),lock=!unlocked(i),ok=mastered(i);
      h+='<button class="item'+(lock?' locked':'')+(ok?' done':'')+'" data-g="'+i+'"'+(lock?' disabled':'')+'>'
       +'<span class="idx">'+(ok?'✓':String(i+1).padStart(2,'0'))+'</span>'
       +'<span class="body"><span class="nm">'+esc(g.t)
       +'<small>'+esc(g.s)+'</small></span></span>'
       +'<span class="cnt">'+st.dots+'/'+PASSES+'</span>'
       +dots(st.dots)+'</button>';
    });
    h+='</div>';
  });
  h+='<div class="lvhead"><span>语法</span><span class="lvline"></span></div><div class="list">'
   +'<button class="item" id="tp"><span class="idx">§</span><span class="body">'
   +'<span class="nm">语法精讲 + 练习<small>Grammatik</small></span></span>'
   +'<span class="cnt">'+TOPICS.length+' 个知识点</span></button></div>';
  h+='<div class="lvhead"><span>阅读</span><span class="lvline"></span></div><div class="list">'
   +'<button class="item" id="rd"><span class="idx">Aa</span><span class="body">'
   +'<span class="nm">阅读理解<small>Leseverstehen</small></span></span>'
   +'<span class="cnt">'+READINGS.filter(r=>unlockedReading(r)).length+'/'+READINGS.length+'</span></button></div>';
  h+='<div class="foot"><div><button id="st">设置</button></div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.item[data-g]').forEach(b=>{b.onclick=()=>go('group',{i:+b.dataset.g});});
  document.getElementById('rd').onclick=()=>go('readings');
  document.getElementById('tp').onclick=()=>go('topics');
  document.getElementById('st').onclick=openSettings;
}
function dots(n){
  let s='<span class="dots">';
  for(let i=0;i<PASSES;i++)s+='<i class="'+(i<n?'on':'')+'"></i>';
  return s+'</span>';
}
function unlockedReading(r){ return r.after<=1 || gs(r.after-1).dots>=PASSES || gs(r.after-1).seen; }

/* ============================================================
   组内模式选择
   ============================================================ */
function renderGroup(i){
  const g=GROUPS[i],st=gs(i),ok=mastered(i);
  let h=topbar(g.t,g.s,true)
   +'<div class="bar"><i style="width:'+(st.dots/PASSES*100)+'%"></i></div>'
   +'<div class="note" style="display:flex;justify-content:space-between;align-items:center">'
   +'<span>掌握度 '+st.dots+' / '+PASSES+'　·　共 '+g.w.length+' 词</span>'+dots(st.dots)+'</div>';
  if(ok)h+='<div class="note" style="color:var(--accent)">这一组已经掌握了。继续练可以巩固，也可以去下一组。</div>';
  h+='<div class="mode-list">'
   +mode('学','学习生词','先认识这 '+g.w.length+' 个词的意思和用法','learn')
   +mode('填','选词填空','看例句，选出正确的词','blank')
   +mode('复','复习生词','中德互译，混合抽测','review')
   +mode('默','默写生词','听发音或看中文，写出德语','dict')
   +'</div>'
   +'<div class="note" style="padding-bottom:26px">默写要一轮全部答对才算一遍，累计 '+PASSES+' 遍解锁下一组。'
   +(S.set.article?'名词需要写出冠词（der / die / das）。':'')+'</div>';
  app.innerHTML=h;
  bindBack(()=>go('home'));
  app.querySelectorAll('.mode').forEach(b=>{
    b.onclick=()=>startSession(b.dataset.m,i);
  });
}
function mode(k,nm,sub,m){
  return '<button class="mode" data-m="'+m+'"><span class="k">'+k+'</span>'
   +'<span class="body"><span class="nm">'+nm+'</span><span class="sub">'+sub+'</span></span>'
   +'<span class="arrow">›</span></button>';
}
function renderReadings(){
  let h=topbar('阅读理解','Leseverstehen',true)+'<div class="list">';
  READINGS.forEach(r=>{
    const ok=unlockedReading(r);
    h+='<button class="item'+(ok?'':' locked')+'" data-r="'+r.id+'"'+(ok?'':' disabled')+'>'
     +'<span class="idx">'+(ok?'Aa':'锁')+'</span>'
     +'<span class="body"><span class="nm">'+esc(r.t)+'<small>'+esc(r.zh)+'</small></span></span>'
     +'<span class="cnt">'+r.qs.length+' 题</span></button>';
  });
  h+='</div><div class="note" style="padding-bottom:30px">文章会随词汇进度解锁。先学对应的词汇组，读起来会顺很多。</div>';
  app.innerHTML=h;
  bindBack(()=>go('home'));
  app.querySelectorAll('.item[data-r]').forEach(b=>{b.onclick=()=>go('reading',{id:b.dataset.r});});
}

/* ============================================================
   会话引擎
   ============================================================ */
function startSession(m,gi){
  const g=GROUPS[gi];
  const words=shuffle(g.w.map(pw));
  ses={mode:m,gi:gi,words:words,i:0,wrong:0,answered:false,roundFailed:false};
  gs(gi).seen=true; save();
  if(m==='dict'){ ses.i=0; }
  render();
}

function renderSession(){
  const m=ses.mode;
  if(m==='learn')  return renderLearn();
  if(m==='blank')  return renderBlank();
  if(m==='review') return renderReview();
  if(m==='dict')   return renderDict();
  if(m==='tq')     return renderTopicQuiz();
}

/* --- 进度条 + 顶栏 --- */
function sesTop(label){
  const g=GROUPS[ses.gi];
  const n=ses.words.length;
  return topbar(label,g.t,true)
   +'<div class="bar"><i style="width:'+(ses.i/n*100)+'%"></i></div>';
}
function exitSes(){ ses=null; go('group',{i:route.i!==undefined?route.i:0}); }

/* ============================================================
   模式一：学习生词
   ============================================================ */
let learnRevealed=false;
function renderLearn(){
  const w=ses.words[ses.i];
  if(!w){ return endSession(); }
  if(learnRevealed){
    app.innerHTML=sesTop('学习生词 · '+(ses.i+1)+'/'+ses.words.length)
     +'<div class="stage"><div class="center">'
     +'<div class="de'+(w.de.length>16?' sm':'')+'">'
       +(w.art?'<span class="art '+artClass(w.art)+'">'+esc(w.art)+'</span> ':'')+esc(w.bare)+'</div>'
     +'<button class="speak" id="sp">'+SPEAK_ICON+'德语发音</button>'
     +'<div class="zh">'+esc(w.zh)+'</div>'
     +(w.hint?'<div class="hint">读音近似：'+esc(w.hint)+'</div>':'')
     +'<div class="ex"><div class="ex-de de">'+sentHTML(w,w.blank)+'</div>'
     +'<div class="zh">'+esc(w.exZh)+'</div></div>'
     +'</div></div>'
     +'<div class="actions"><button class="btn primary" id="nx">'
     +(ses.i+1<ses.words.length?'下一个':'学完了')+'</button></div>';
  }else{
    app.innerHTML=sesTop('学习生词 · '+(ses.i+1)+'/'+ses.words.length)
     +'<div class="stage"><div class="center">'
     +'<div class="de'+(w.de.length>16?' sm':'')+'">'
       +(w.art?'<span class="art '+artClass(w.art)+'">'+esc(w.art)+'</span> ':'')+esc(w.bare)+'</div>'
     +'<button class="speak" id="sp">'+SPEAK_ICON+'德语发音</button>'
     +'</div></div>'
     +'<div class="actions"><button class="btn primary" id="nx">显示意思</button></div>';
  }
  bindBack(exitSes);
  document.getElementById('sp').onclick=()=>speak(w.de);
  document.getElementById('nx').onclick=()=>{
    if(learnRevealed){learnRevealed=false;ses.i++;render();}
    else{learnRevealed=true;render();}
  };
}

/* ============================================================
   模式二：选词填空
   ============================================================ */
function makeOptions(w,all,field){
  const pool=shuffle(all.filter(x=>x[field]!==w[field])).slice(0,3).map(x=>x[field]);
  return shuffle([w[field]].concat(pool));
}
function renderBlank(){
  const w=ses.words[ses.i];
  if(!w||!w.blank){ return endSession(); }
  const all=ses.words.filter(x=>x.blank);
  const opts=ses.opts||(ses.opts=makeOptions(w,all,'blank'));
  let h=sesTop('选词填空 · '+(ses.i+1)+'/'+ses.words.length)
   +'<div class="stage"><div style="padding-top:34px">'
   +'<div class="de" style="font-size:clamp(21px,6vw,26px);line-height:1.55">'
   +sentHTML(w, ses.picked===undefined?null:(ses.picked===w.blank?w.blank:false))
   +'</div><div class="zh dim" style="margin-top:14px;font-size:15px">'+esc(w.exZh)+'</div>'
   +'</div></div><div class="opts">';
  opts.forEach((o,k)=>{
    let cls='opt';
    if(ses.picked!==undefined){
      if(o===w.blank)cls+=' correct';
      else if(o===ses.picked)cls+=' wrong';
      else cls+=' muted';
    }
    h+='<button class="'+cls+'" data-o="'+esc(o)+'"'+(ses.picked!==undefined?' disabled':'')+'>'
     +'<span class="n">'+'ABCD'[k]+'</span>'+esc(o)+'</button>';
  });
  h+='</div>';
  if(ses.picked!==undefined){
    h+='<div class="actions" style="padding-top:0"><button class="btn primary" id="nx">'
     +(ses.i+1<ses.words.length?'下一题':'完成')+'</button></div>';
  }else{h+='<div style="height:30px"></div>';}
  app.innerHTML=h;
  bindBack(exitSes);
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(ses.picked!==undefined)return;
      ses.picked=b.dataset.o;
      const ok=ses.picked===w.blank;
      if(!ok)ses.wrong++;
      render();
    };
  });
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.picked=undefined;ses.opts=null;ses.i++;render();};
}

/* ============================================================
   模式三：复习（中德互译）
   ============================================================ */
function renderReview(){
  const w=ses.words[ses.i];
  if(!w)return endSession();
  if(ses.dir===undefined)ses.dir=Math.random()<0.5?'de2zh':'zh2de';
  const all=ses.words;
  const field=ses.dir==='de2zh'?'zh':'bare';
  const opts=ses.opts||(ses.opts=makeOptions(w,all,field));
  const prompt=ses.dir==='de2zh'
    ? '<div class="de'+(w.de.length>16?' sm':'')+'">'
      +(w.art?'<span class="art '+artClass(w.art)+'">'+esc(w.art)+'</span> ':'')+esc(w.bare)+'</div>'
    : '<div class="zh" style="font-size:26px">'+esc(w.zh)+'</div>';
  let h=sesTop('复习 · '+(ses.i+1)+'/'+ses.words.length)
   +'<div class="stage"><div class="center">'+prompt
   +'<div class="hint" style="margin-top:12px">'
   +(ses.dir==='de2zh'?'选出中文意思':'选出对应的德语')+'</div></div></div><div class="opts">';
  opts.forEach((o,k)=>{
    let cls='opt';
    if(ses.picked!==undefined){
      if(o===w[field])cls+=' correct';
      else if(o===ses.picked)cls+=' wrong';
      else cls+=' muted';
    }
    const isDe=(ses.dir==='zh2de');
    h+='<button class="'+cls+'" data-o="'+esc(o)+'"'+(ses.picked!==undefined?' disabled':'')+'>'
     +'<span class="n">'+'ABCD'[k]+'</span>'
     +(isDe?'<span style="font-family:var(--font-de);font-size:18px">'+esc(o)+'</span>':esc(o))
     +'</button>';
  });
  h+='</div>';
  if(ses.picked!==undefined)
    h+='<div class="actions" style="padding-top:0"><button class="btn primary" id="nx">'
     +(ses.i+1<ses.words.length?'下一题':'完成')+'</button></div>';
  else h+='<div style="height:30px"></div>';
  app.innerHTML=h;
  bindBack(exitSes);
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(ses.picked!==undefined)return;
      ses.picked=b.dataset.o;
      if(ses.picked!==w[field])ses.wrong++;
      render();
    };
  });
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.picked=undefined;ses.opts=null;ses.dir=undefined;ses.i++;render();};
}

/* ============================================================
   模式四：默写生词（听力/中文提示 → 写出德语）
   ============================================================ */
function norm(s){
  return String(s).toLowerCase().trim().replace(/\s+/g,' ')
   .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
   .replace(/[.,!?;:]/g,'');
}
function renderDict(){
  const w=ses.words[ses.i];
  if(!w)return endDictRound();
  const expect = (w.art&&S.set.article) ? (w.art+' '+w.bare) : w.bare;
  let h=sesTop('默写 · '+(ses.i+1)+'/'+ses.words.length)
   +'<div class="stage"><div style="padding-top:26px">'
   +'<div class="zh" style="font-size:24px">'+esc(w.zh)+'</div>'
   +'<div class="hint" style="margin-top:10px">写出对应的德语'
   +(w.art&&S.set.article?'（含冠词）':'')+'</div>'
   +'<button class="speak" id="sp" style="margin-top:16px">'+SPEAK_ICON+'再听一次</button>'
   +'<div style="margin-top:22px"><input class="input" id="in" autocomplete="off" '
   +'autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入德语"></div>'
   +'<div class="specials"><button data-c="ä">ä</button><button data-c="ö">ö</button>'
   +'<button data-c="ü">ü</button><button data-c="ß">ß</button></div>';
  if(ses.judged){
    const ok=ses.wasOk;
    h+='<div class="judge '+(ok?'ok':'no')+'">'
     +(ok?'正确　<b>'+esc(expect)+'</b>'
         :'正确写法是　<b>'+esc(expect)+'</b>'
          +(ses.reason==='art'?'　<span style="font-size:13px">别漏了冠词</span>':''))
     +'</div>';
  }
  h+='</div></div><div class="actions">'
   +(ses.judged
     ?'<button class="btn primary" id="nx">'+(ses.i+1<ses.words.length?'下一个':'看本轮结果')+'</button>'
     :'<button class="btn primary" id="ck">检查</button>')
   +'</div>';
  app.innerHTML=h;
  bindBack(exitSes);
  const inp=document.getElementById('in');
  document.getElementById('sp').onclick=()=>speak(w.de);
  app.querySelectorAll('.specials button').forEach(b=>{
    b.onclick=()=>{
      const p=inp.selectionStart||inp.value.length;
      inp.value=inp.value.slice(0,p)+b.dataset.c+inp.value.slice(p);
      inp.focus(); inp.setSelectionRange(p+1,p+1);
    };
  });
  const check=()=>{
    if(ses.judged)return;
    const v=inp.value.trim();
    if(!v)return;
    ses.judged=true;
    const target=norm(expect), got=norm(v);
    ses.wasOk = got===target;
    if(!ses.wasOk){
      ses.reason = (w.art&&S.set.article&&got===norm(w.bare))?'art':'';
      ses.wrong++;
    }
    render();
  };
  const ck=document.getElementById('ck');
  if(ck)ck.onclick=check;
  if(!ses.judged&&inp){
    inp.onkeydown=e=>{if(e.key==='Enter')check();};
    const spEl=document.getElementById('sp');
    setTimeout(()=>{speak(w.de);},60);
  }
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.i++;ses.judged=false;ses.wasOk=false;ses.reason='';render();};
}
function endDictRound(){
  const perfect = ses.wrong===0;
  const st=gs(ses.gi);
  if(perfect){
    st.dots=Math.min(PASSES,st.dots+1); save();
  }else if(S.set.strict){
    st.dots=0; save();
  }
  const g=GROUPS[ses.gi], ok=mastered(ses.gi);
  const nextIdx=ses.gi+1;
  let h=sesTop('本轮结果')
   +'<div class="stage"><div class="center" style="text-align:center">'
   +'<div class="de" style="font-size:34px">'+(perfect?'Sehr gut!':'Fast!')+'</div>'
   +'<div class="zh" style="margin-top:12px">'
   +(perfect?'一轮全部正确':'本轮错了 '+ses.wrong+' 个')+'</div>'
   +'<div style="margin-top:26px;display:flex;justify-content:center">'+dots(st.dots)+'</div>'
   +'<div class="hint" style="margin-top:12px">掌握度 '+st.dots+' / '+PASSES
   +(perfect?'':'　（只有全对的一轮才算一遍）')+'</div>'
   +(ok?'<div class="zh" style="margin-top:22px;color:var(--accent)">这一组掌握了。</div>':'')
   +'</div></div>'
   +'<div class="actions">'
   +'<button class="btn primary" id="again">再默写一轮</button>'
   +(ok&&nextIdx<GROUPS.length
      ?'<button class="btn" id="next">进入下一组：'+esc(GROUPS[nextIdx].t)+'</button>':'')
   +'<button class="btn ghost" id="bk2">回到这一组</button>'
   +'</div>';
  app.innerHTML=h;
  bindBack(()=>{ses=null;go('home');});
  document.getElementById('again').onclick=()=>{
    const gi=ses.gi; ses=null; startSession('dict',gi);
  };
  const nb=document.getElementById('next');
  if(nb)nb.onclick=()=>{const n=nextIdx;ses=null;go('group',{i:n});};
  document.getElementById('bk2').onclick=()=>{const gi=ses.gi;ses=null;go('group',{i:gi});};
}

/* ============================================================

  const m=ses.mode,gi=ses.gi;

/* ============================================================
   语法精讲 + 练习（讲义与习题绑在一条里）

function topicDone(ti){ const st=gs(2000+ti); return !!st.done; }

function renderTopicList(){
  const levels=[...new Set(TOPICS.map(t=>t.lv||'A1'))];
  let h=topbar('语法精讲 + 练习','Grammatik',true);
  levels.forEach(lv=>{
    h+='<div class="lvhead"><span>'+esc(lv)+'</span><span class="lvline"></span></div><div class="list">';
    TOPICS.forEach((t,i)=>{
      if((t.lv||'A1')!==lv)return;
      const ok=topicDone(i);
      h+='<button class="item'+(ok?' done':'')+'" data-tp="'+i+'">'
       +'<span class="idx">'+(ok?'✓':String(i+1).padStart(2,'0'))+'</span>'
       +'<span class="body"><span class="nm">'+esc(t.t)+'<small>'+esc(t.s||'')+'</small></span></span>'
       +'<span class="cnt">'+t.items.length+' 题</span></button>';

}

function renderTopic(i){
  const t=TOPICS[i];
  if(!t)return go('topics');
  let h=topbar(t.t,t.s||'',true)+'<div class="core">'+t.core+'</div>';
  if(t.rows&&t.rows.length){
    h+='<div class="rtable">';
    t.rows.forEach(r=>{
      const g=/^(der|die|das)$/.test(String(r[1]||'').trim())?' g-'+String(r[1]).trim():'';
      h+='<div class="r"><div class="c1">'+r[0]+'</div><div class="c2">'
       +(r[1]?'<b class="'+g.trim()+'">'+r[1]+'</b>':'')
       +(r[2]?'<span>'+r[2]+'</span>':'')
       +'</div></div>';
    });
    h+='</div>';
  }
  if(t.egs&&t.egs.length){
    h+='<div class="regs">';
    t.egs.forEach(e=>{h+='<div class="e"><div class="de">'+e[0]+'</div><div class="zh">'+e[1]+'</div></div>';});
    h+='</div>';
  }
  if(t.note)h+='<div class="rnote">'+t.note+'</div>';
  h+='<div class="navrow"><button class="btn primary" id="quiz">练这 '+t.items.length+' 题</button></div>'
   +'<div class="navrow" style="padding-top:0">'
   +(i>0?'<button class="btn" id="pv">上一条</button>':'')
   +(i<TOPICS.length-1?'<button class="btn" id="nx">下一条</button>':'')
   +'</div>'
   +'<div class="foot" style="padding-top:6px"><div><button id="allc">回到目录</button></div></div>';
  app.innerHTML=h;
  bindBack(()=>go('topics'));
  document.getElementById('quiz').onclick=()=>startTopicQuiz(i);
  const pv=document.getElementById('pv'); if(pv)pv.onclick=()=>go('topic',{i:i-1});
  const nx=document.getElementById('nx'); if(nx)nx.onclick=()=>go('topic',{i:i+1});
  document.getElementById('allc').onclick=()=>go('topics');
}

/* ---------- 这条知识点专属的练习 ---------- */
function startTopicQuiz(ti){
  const t=TOPICS[ti];
  ses={mode:'tq',ti:ti,t:t,items:shuffle(t.items),i:0,wrong:0,picked:undefined};
  render();
}
function renderTopicQuiz(){
  const t=ses.t, it=ses.items[ses.i];
  if(!it)return endTopicQuiz();
  const n=ses.items.length;
  let h=topbar(t.t,t.s||'',true)
   +'<div class="bar"><i style="width:'+(ses.i/n*100)+'%"></i></div>'
   +'<div style="padding:22px var(--pad) 0">'
   +'<div class="hint" style="margin:0 0 8px">第 '+(ses.i+1)+' / '+n+' 题</div>'
   +'<div class="de" style="font-size:clamp(19px,5.4vw,23px);line-height:1.65">'+esc(it.q)+'</div>'
   +'</div><div class="opts">';
  it.opts.forEach((o,k)=>{
    let cls='opt';
    if(ses.picked!==undefined){
      if(o===it.a)cls+=' correct';
      else if(o===ses.picked)cls+=' wrong';
      else cls+=' muted';
    }
    h+='<button class="'+cls+'" data-o="'+esc(o)+'"'+(ses.picked!==undefined?' disabled':'')+'>'
     +'<span class="n">'+'ABCD'[k]+'</span>'+esc(o)+'</button>';
  });
  h+='</div>';
  if(ses.picked!==undefined){
    const right=(ses.picked===it.a);
    if(!right){
      h+='<div class="rnote" style="margin:0 var(--pad)"><strong>回顾这条的规则</strong><br>'+t.core+'</div>';
    }
    h+='<div class="judge '+(right?'ok':'no')+'" style="margin:16px var(--pad) 0">'+esc(it.why)+'</div>'
     +'<div class="actions" style="padding:18px var(--pad) 30px">'
     +'<button class="btn primary" id="nx">'+(ses.i+1>=n?'看结果':'下一题')+'</button></div>';
  }else h+='<div style="height:30px"></div>';
  app.innerHTML=h;
  const ti=ses.ti;
  bindBack(()=>{ses=null;go('topic',{i:ti});});
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(ses.picked!==undefined)return;
      ses.picked=b.dataset.o;
      if(ses.picked!==it.a)ses.wrong++;
      render();
    };
  });
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{ses.picked=undefined;ses.i++;render();};
}
function endTopicQuiz(){
  const ti=ses.ti, t=ses.t, wrong=ses.wrong, n=ses.items.length;
  if(wrong===0){ gs(2000+ti).done=true; save(); }
  app.innerHTML=topbar('结果',t.t,true)
   +'<div class="stage"><div class="center" style="text-align:center">'
   +'<div class="de" style="font-size:34px">'+(n-wrong)+' / '+n+'</div>'
   +'<div class="zh" style="margin-top:12px">'
   +(wrong===0?'全对，这条过了':'错了 '+wrong+' 题，回去把讲义再看一遍')+'</div>'
   +'</div></div><div class="actions">'
   +'<button class="btn primary" id="re">重做这 '+n+' 题</button>'
   +'<button class="btn" id="rd">再看这条讲义</button>'
   +'<button class="btn ghost" id="bk2">回到目录</button></div>';
  bindBack(()=>{ses=null;go('topics');});
  document.getElementById('re').onclick=()=>{ses=null;startTopicQuiz(ti);};
  document.getElementById('rd').onclick=()=>{ses=null;go('topic',{i:ti});};
  document.getElementById('bk2').onclick=()=>{ses=null;go('topics');};
}

/* ============================================================
   进度备份：导出/导入一串进度码
   进度存在浏览器本地，换设备、换浏览器、或在 file:// 下打开单文件版时
   都可能拿不到。一串可复制的码是唯一到处都可靠的办法。
   ============================================================ */
function storageAvailable(){
  try{
    localStorage.setItem('__t','1');
    const ok=localStorage.getItem('__t')==='1';
    localStorage.removeItem('__t');
    return ok;
  }catch(e){ return false; }
}
let STORAGE_OK = storageAvailable();

function exportCode(){
  const parts=[];
  Object.keys(S.g).forEach(k=>{
    const st=S.g[k]; if(!st)return;
    if(st.dots||st.seen) parts.push(k.slice(1)+':'+(st.dots||0));
  });
  const cfg=[S.set.article?1:0, S.set.strict?1:0, S.set.allOpen?1:0,
             S.set.rate===0.85?'a':S.set.rate===0.6?'b':'c'].join('');
  return 'DT1.'+cfg+'.'+parts.join(',');
}
function importCode(code){
  const m=String(code||'').trim().match(/^DT1\.([0-9ab]{4})\.(.*)$/);
  if(!m) throw new Error('格式不对，请完整复制整串进度码');
  const cfg=m[1], g={};
  const body=m[2].trim();
  if(body){
    body.split(',').forEach(p=>{
      const a=p.split(':');
      const i=parseInt(a[0],10);
      if(!isNaN(i)&&i>=0){
        g['g'+i]={dots:Math.max(0,Math.min(PASSES,parseInt(a[1],10)||0)),seen:true,w:{}};
      }
    });
  }
  return {g:g, set:{article:cfg[0]==='1',strict:cfg[1]==='1',allOpen:cfg[2]==='1',
          rate:cfg[3]==='a'?0.85:cfg[3]==='b'?0.6:0.45}};
}
function renderBackup(){
  const code=exportCode();
  let n=0; Object.keys(S.g).forEach(k=>{const st=S.g[k]; if(st&&(st.dots||st.seen))n++;});
  app.innerHTML=topbar('进度备份','Sicherung',true)
   +'<div class="note" style="padding-top:18px">进度存在这台设备的浏览器里。'
   +'换设备、换浏览器、或者改用在线的单文件版时，用下面这串码把进度搬过去。</div>'
   +'<div style="padding:6px var(--pad) 0">'
   +'<div class="hint" style="margin-bottom:6px">当前进度码（'+n+' 组有记录）</div>'
   +'<textarea class="input" id="exp" readonly style="height:104px;font-family:var(--font-mono);font-size:13px;line-height:1.5">'+esc(code)+'</textarea>'
   +'<div style="margin-top:10px"><button class="btn" id="cp">复制进度码</button></div>'
   +'</div>'
   +'<div style="padding:26px var(--pad) 0">'
   +'<div class="hint" style="margin-bottom:6px">导入：把进度码粘到这里</div>'
   +'<textarea class="input" id="imp" placeholder="DT1.1110.0:5,1:3" style="height:104px;font-family:var(--font-mono);font-size:13px;line-height:1.5"></textarea>'
   +'<div style="margin-top:10px"><button class="btn primary" id="do">导入并覆盖当前进度</button></div>'
   +'<div id="msg" class="hint" style="margin-top:12px"></div>'
   +'</div><div style="height:30px"></div>';
  bindBack(()=>go('home'));
  document.getElementById('cp').onclick=()=>{
    const t=document.getElementById('exp');
    let ok=false;
    try{
      t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0,999999);
      ok=document.execCommand('copy');
      t.setAttribute('readonly','readonly');
    }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(()=>{},()=>{});
      ok=true;
    }
    document.getElementById('cp').textContent = ok?'已复制到剪贴板':'请长按选中后复制';
  };
  document.getElementById('do').onclick=()=>{
    const msg=document.getElementById('msg');
    try{
      const d=importCode(document.getElementById('imp').value);
      S.g=d.g; S.set=d.set; save();
      msg.textContent='导入成功，进度已更新';
      msg.style.color='var(--ok)';
      setTimeout(()=>go('home'),800);
    }catch(e){
      msg.textContent='导入失败：'+e.message;
      msg.style.color='var(--no)';
    }
  };
}

/* ============================================================
   设置
   ============================================================ */
function openSettings(){
  let h=topbar('设置','Einstellungen',true)

   +'<button class="mode" id="t4"><span class="k">⇅</span><span class="body">'

   +'<button class="mode" id="bk"><span class="k">⇄</span><span class="body">'
   +'<span class="nm">进度备份</span><span class="sub">导出一串进度码，换设备时搬过去</span></span></button>'

   +'<span class="nm">清空全部进度</span><span class="sub">重新从第一组开始，无法撤销</span></span></button>'
   +'</div><div style="height:30px"></div>';
  app.innerHTML=h;
  bindBack(()=>go('home'));
  document.getElementById('t1').onclick=()=>{S.set.article=!S.set.article;save();openSettings();};
  document.getElementById('t2').onclick=()=>{S.set.strict=!S.set.strict;save();openSettings();};
  document.getElementById('t3').onclick=()=>{
    S.set.rate = S.set.rate===0.85?0.6:S.set.rate===0.6?0.45:0.85; save(); openSettings();
  };
  document.getElementById('t4').onclick=()=>{S.set.allOpen=!S.set.allOpen;save();openSettings();};
  document.getElementById('bk').onclick=()=>go('backup');
  document.getElementById('rs').onclick=()=>{
    if(confirm('确定清空全部学习进度？这个操作无法撤销。')){S=JSON.parse(JSON.stringify(DEF));save();go('home');}
  };
}

load();
